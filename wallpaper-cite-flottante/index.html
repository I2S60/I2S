<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  canvas { display: block; width: 100%; height: 100%; }
  #err { display: none; position: fixed; left: 8px; bottom: 8px; max-width: 92%; padding: 6px 10px; z-index: 9;
         font: 12px/1.4 monospace; color: #ffc0c0; background: rgba(0,0,0,.7); white-space: pre-wrap; }
</style>

<body>
<canvas id="c"></canvas>
<div id="err"></div>

<script>
/* ==========================================================================
   CITÉ DES ÎLES FLOTTANTES — Wallpaper Engine (web wallpaper)
   Version 1 : ciel lié à l'heure réelle, lac, montagnes, îles en silhouette.
   Rendu : Canvas 2D uniquement, aucune dépendance externe.

   Paramètres de test dans un navigateur classique (hors Wallpaper Engine) :
     index.html?hour=18.5      -> force l'heure (18h30)
     index.html?speed=300      -> accélère le cycle (300x)
     index.html?debug          -> affiche l'heure et les FPS
   ========================================================================== */
(() => {
'use strict';

const BUILD = 'v1.7';
const QS = new URLSearchParams(location.search);   // paramètres de test : ?dragon et ?monster font apparaître les créatures tout de suite   // affiché sous la date ; à changer à chaque livraison pour vérifier quelle version tourne

/* --------------------------------------------------------------------------
   1. CONFIGURATION (modifiée par les propriétés de Wallpaper Engine)
   -------------------------------------------------------------------------- */
const cfg = {
  cycleSpeed:  1,      // 1 = temps réel ; 60 = 1 minute réelle = 1 heure
  testMode:    false,  // true = heure forcée
  testHour:    19,     // heure forcée (0-24)
  floatAmp:    1,      // amplitude du flottement des îles
  moonPhase:  -1,      // -1 = phase réelle du jour ; 0 à 1 = forcée (0 nouvelle, 0.5 pleine)
  particles:   1,      // intensité des particules (0 = aucune, 2 = maximum)
  painted:     0.7,    // force de l'effet « peinture » (grain de toile, coups de pinceau)
  godRays:     0.4,    // intensité des rayons de lumière
  showClock:   true,   // affiche l'heure à l'écran (désactivable dans les réglages)
  renderScale: 1,      // résolution interne (0.5 à 1)
  fpsLimit:    60,     // fournie par Wallpaper Engine (réglage « FPS » global)
  debug:       false
};

// Paramètres d'URL, pratiques pour tester dans Chrome/Firefox
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has('hour'))  { cfg.testMode = true; cfg.testHour = parseFloat(q.get('hour')) || 0; }
  if (q.has('speed')) cfg.cycleSpeed = parseFloat(q.get('speed')) || 1;
  if (q.has('moon'))  cfg.moonPhase = Math.min(1, Math.max(0, parseFloat(q.get('moon')) || 0));
  if (q.has('particles')) cfg.particles = parseFloat(q.get('particles')) || 0;
  if (q.has('paint'))     cfg.painted   = parseFloat(q.get('paint')) || 0;
  if (q.has('rays'))      cfg.godRays   = parseFloat(q.get('rays')) || 0;
  if (q.has('debug')) cfg.debug = true;
})();

/* --------------------------------------------------------------------------
   2. OUTILS (maths, couleurs, aléatoire reproductible)
   -------------------------------------------------------------------------- */
const clamp  = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp   = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);

// "#rrggbb" -> [r, g, b]
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
// Mélange de deux couleurs [r,g,b]
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
// [r,g,b] -> "rgba(...)"
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// Affiche les erreurs à l'écran (utile pour diagnostiquer dans Wallpaper Engine)
function reportError(e, where) {
  const el = document.getElementById('err');
  const line = e && e.stack ? ' ' + String(e.stack).split('\n')[1] : '';
  const msg = (where ? '[' + where + '] ' : '') + (e && e.message ? e.message : e) + line;
  if (el) { el.style.display = 'block'; el.textContent += msg + '\n'; }
  if (window.console) console.error(e);
}
window.addEventListener('error', ev => reportError(ev.error || ev.message, 'global'));

// Isole une fonction facultative : si elle plante, elle est désactivée et le reste continue
function safe(name, fn) {
  let dead = false;
  return function (...a) {
    if (dead) return;
    try { return fn.apply(this, a); }
    catch (e) {
      dead = true; reportError(e, name);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.setLineDash([]);
    }
  };
}

// Générateur pseudo-aléatoire à graine : le décor est identique à chaque lancement
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* --------------------------------------------------------------------------
   3. CYCLE JOUR / NUIT : couleurs clés selon l'heure
      top  = zénith, hor = horizon, glow = halo du soleil,
      sil  = couleur des silhouettes (îles, montagnes), star = visibilité étoiles
   -------------------------------------------------------------------------- */
const KEYS = [
  { h: 0,    top: '#040612', hor: '#0c1330', glow: '#2a3a7a', sil: '#03050c', star: 1    }, // nuit profonde
  { h: 4.5,  top: '#070b24', hor: '#161d46', glow: '#33407f', sil: '#04060f', star: 1    },
  { h: 5.5,  top: '#1c2760', hor: '#5a4a86', glow: '#ff8a66', sil: '#0a0c1c', star: 0.6  }, // aube
  { h: 6.3,  top: '#3b5a9e', hor: '#f7a679', glow: '#ffb878', sil: '#2a2740', star: 0.1  },
  { h: 7.5,  top: '#4a86c8', hor: '#d5e4ee', glow: '#fff0c8', sil: '#35506a', star: 0    }, // matin
  { h: 12,   top: '#2b78d2', hor: '#a8d3f3', glow: '#fffbe8', sil: '#2f4a66', star: 0    }, // midi
  { h: 16.5, top: '#3a82cc', hor: '#bcd9ee', glow: '#fff2cc', sil: '#31485f', star: 0    },
  { h: 18,   top: '#3f5da0', hor: '#f0b58a', glow: '#ffb070', sil: '#3a3350', star: 0    }, // fin d'après-midi
  { h: 19.2, top: '#2b3170', hor: '#ff7d52', glow: '#ff6a3a', sil: '#1c1530', star: 0.05 }, // coucher
  { h: 20,   top: '#1a1d50', hor: '#8a4c7e', glow: '#d9607a', sil: '#0d0b1e', star: 0.5  }, // crépuscule
  { h: 21,   top: '#0a0e2c', hor: '#1d2352', glow: '#3a4a8a', sil: '#06081a', star: 1    },
  { h: 24,   top: '#040612', hor: '#0c1330', glow: '#2a3a7a', sil: '#03050c', star: 1    }  // = 0h (boucle)
].map(k => ({ h: k.h, top: hex(k.top), hor: hex(k.hor), glow: hex(k.glow), sil: hex(k.sil), star: k.star }));

// Interpole deux clés voisines avec une courbe douce : jamais de saut brusque
function skyAt(h) {
  let i = 0;
  while (i < KEYS.length - 2 && h >= KEYS[i + 1].h) i++;
  const a = KEYS[i], b = KEYS[i + 1];
  const t = smooth(clamp((h - a.h) / (b.h - a.h), 0, 1));
  return {
    top:  mix(a.top,  b.top,  t),
    hor:  mix(a.hor,  b.hor,  t),
    glow: mix(a.glow, b.glow, t),
    sil:  mix(a.sil,  b.sil,  t),
    star: lerp(a.star, b.star, t)
  };
}

/* --------------------------------------------------------------------------
   4. ÉTAT GLOBAL ET REDIMENSIONNEMENT
   -------------------------------------------------------------------------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, HZ = 0, U = 0;   // largeur, hauteur, ligne d'horizon, unité de taille
let mountains = [];                // couches de montagnes
let islands = [];                  // îles flottantes
let stars = [];                    // étoiles
let bridges = [];                  // ponts suspendus entre les îles
let mwCanvas = null;               // voie lactée pré-rendue
let lamp = 0;                      // éclairage de la ville : 0 = éteinte, 1 = tout allumé
let shoot = null, nextShoot = 6;   // étoile filante en cours / prochaine apparition (s)
const shootRng = rng(5);

// Sprite de halo chaud (lanternes), dessiné une fois puis réutilisé
const GLOW = document.createElement('canvas');
GLOW.width = GLOW.height = 64;
{
  const c = GLOW.getContext('2d');
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,220,150,1)');
  g.addColorStop(0.25, 'rgba(255,175,85,0.55)');
  g.addColorStop(1, 'rgba(255,140,50,0)');
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
}

// Phase réelle de la lune : 0 = nouvelle, 0.5 = pleine, 1 = nouvelle
function moonPhaseNow() {
  const jd = Date.now() / 86400000 + 2440587.5;            // jour julien
  return (((jd - 2451550.1) / 29.530588853) % 1 + 1) % 1;
}

// Halo + cœur lumineux d'une lanterne (mélange additif)
function glow(x, y, size, a) {
  if (a < 0.02) return;
  const pa = ctx.globalAlpha;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = pa * a;
  ctx.drawImage(GLOW, x - size / 2, y - size / 2, size, size);
  ctx.fillStyle = '#ffe6b0';
  ctx.fillRect(x - size * 0.07, y - size * 0.07, size * 0.14, size * 0.14);
  ctx.globalAlpha = pa;
  ctx.globalCompositeOperation = 'source-over';
}

// Ellipse dans un Path2D : on pose d'abord le point de départ, sinon le navigateur trace un segment parasite
function ell(p, x, y, rx, ry, rot = 0) {
  p.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot));
  p.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
}

// Essences d'arbres (silhouettes, base en y = 0, hauteur de 8 à 16 unités) ; sw = sensibilité au vent
const TREE_TYPES = (() => {
  const mk = f => { const p = new Path2D(); f(p); return p; };
  return {
    round:   { sw: 1,   path: mk(p => { p.rect(-0.7, -5, 1.4, 5.5); ell(p, 0, -9.5, 4.2, 5.6); ell(p, -2.4, -6.6, 3, 3.4); ell(p, 2.4, -6.6, 3, 3.4); }) },
    pine:    { sw: 0.6, path: mk(p => {
      p.rect(-0.5, -3, 1, 3.4);
      for (const [apex, base, half] of [[-16, -10.5, 2.6], [-13, -6.5, 3.5], [-9.5, -2.6, 4.4]]) {   // trois étages de branches
        p.moveTo(0, apex); p.lineTo(-half, base); p.lineTo(half, base); p.closePath();
      } }) },
    cypress: { sw: 0.5, path: mk(p => { p.rect(-0.4, -2, 0.8, 2.4); ell(p, 0, -8.5, 1.9, 7); }) },
    bush:    { sw: 0.3, path: mk(p => { ell(p, 0, -1.8, 3.2, 2.2); ell(p, -2.6, -1.2, 2.4, 1.7); ell(p, 2.6, -1.2, 2.4, 1.7); }) },
    willow:  { sw: 1.3, path: mk(p => {                         // saule pleureur : voûte + branches retombantes
      p.rect(-0.7, -5, 1.4, 5.5); ell(p, 0, -9, 5.2, 3.2);
      for (let i = -4; i <= 4; i++) p.rect(i * 1.15 - 0.2, -8.5, 0.45, 4.2 + ((i * 7) % 3 + 3) * 0.6); }) },
    palm:    { sw: 1.5, path: mk(p => {                         // palmier : tronc courbe + palmes qui retombent
      p.moveTo(-0.6, 0.4); p.quadraticCurveTo(-0.2, -7, 1.2, -13); p.lineTo(2, -13); p.quadraticCurveTo(0.8, -7, 0.7, 0.4); p.closePath();
      for (const dx of [-4.2, -3, -1.4, 1.4, 3, 4.2]) ell(p, 1.6 + dx, -13 + Math.abs(dx) * 0.35 - 0.8, 3.2, 0.9, dx * 0.12); }) }
  };
})();
// Échelle aléatoire (min, max) selon l'essence
const TREE_SCALE = { round: [0.7, 1.1], pine: [0.9, 1.3], cypress: [0.9, 1.4], willow: [0.9, 1.15], palm: [0.9, 1.15], bush: [0.9, 1.3] };

function resize() {
  W = window.innerWidth || 1920; H = window.innerHeight || 1080;   // repli si la fenêtre n'a pas encore de taille
  canvas.width  = Math.round(W * cfg.renderScale);
  canvas.height = Math.round(H * cfg.renderScale);
  HZ = H * 0.64;                           // ligne d'horizon
  U  = Math.min(W, H * 1.78);              // unité qui évite les îles géantes en ultra-wide
  buildMountains();
  buildIslands();
  buildStars();
  buildWorld();
}

/* --------------------------------------------------------------------------
   5. MONTAGNES (procédurales, encadrent le lac)
   -------------------------------------------------------------------------- */
function buildMountains() {
  // couches : de la plus lointaine (brumeuse) à la plus proche (sombre)
  const defs = [
    { seed: 11, amp: 0.30, haze: 0.62, edge: 0.30, pow: 1.3, f: 0.0035 },
    { seed: 23, amp: 0.22, haze: 0.42, edge: 0.15, pow: 1.5, f: 0.0050 },
    { seed: 37, amp: 0.12, haze: 0.20, edge: 0.00, pow: 2.3, f: 0.0075 }
  ];
  mountains = defs.map(d => {
    const r = rng(d.seed), tbl = Array.from({ length: 512 }, r);
    const noise = x => {                               // bruit 1D interpolé
      const i = Math.floor(x), f = smooth(x - i);
      return lerp(tbl[((i % 512) + 512) % 512], tbl[(((i + 1) % 512) + 512) % 512], f);
    };
    const amp = d.amp * H, p = new Path2D();
    p.moveTo(0, HZ + 3);
    for (let x = 0; x <= W + 6; x += 6) {
      let n = 0, a = 1, s = 0;
      for (let o = 0; o < 5; o++) { n += a * noise(x * d.f * (1 << o) + d.seed * 7); s += a; a *= 0.5; }
      n /= s;
      const ridge = 1 - Math.abs(2 * n - 1);           // arêtes pointues
      const env = d.edge + (1 - d.edge) * Math.pow(Math.abs(2 * x / W - 1), d.pow);
      p.lineTo(x, HZ - env * amp * (0.25 + 0.75 * (0.5 * n + 0.5 * ridge)));
    }
    p.lineTo(W + 6, HZ + 3);
    p.closePath();
    return { path: p, amp, haze: d.haze };
  });
}

/* --------------------------------------------------------------------------
   6. ÎLES FLOTTANTES : chaque île a un thème, une forme de rocher et des habitants
      Coordonnées locales : l'île fait 100 unités de large, surface en y = 0.
   -------------------------------------------------------------------------- */
// Largeur occupée (unités locales) par chaque type d'élément posé sur une île
const WIDTH = { tree: 9, bush: 5, house: 9, longhouse: 14, tower: 6, keep: 15, chapel: 10, windmill: 9,
                pagoda: 11, dome: 10, lighthouse: 7, stall: 6, obelisk: 3, fence: 9,
                townhouse: 7, hall: 16, rotunda: 11, silo: 9, cottage: 9, clocktower: 7, ruins: 12, gazebo: 8, barn: 14 };
// Thèmes : éléments obligatoires, éléments de remplissage (poids), essences d'arbres (poids), nombre d'habitants
const THEMES = {
  castle:  { must: ['keep', 'tower', 'tower', 'chapel'], fill: { house: 2, townhouse: 2, hall: 1, tree: 2, stall: 1, bush: 1, obelisk: 0.5, clocktower: 0.6, gazebo: 0.4 }, trees: { round: 3, cypress: 1, cherry: 1.5, pine: 1 }, people: 4 },
  village: { must: ['chapel', 'townhouse', 'house'], fill: { house: 3, townhouse: 2, cottage: 2, clocktower: 0.5, hall: 0.5, stall: 1.5, tree: 2, bush: 1, longhouse: 0.5 }, trees: { round: 2, pine: 2, cherry: 1, willow: 0.6 }, people: 3 },
  farm:    { must: ['windmill', 'barn'], fill: { silo: 1.5, cottage: 1.5, longhouse: 1, fence: 2, tree: 2, bush: 2, house: 1, windmill: 0.4 }, trees: { round: 3, willow: 1 }, people: 3 },
  forest:  { must: [], fill: { tree: 6, bush: 2, cottage: 0.8, ruins: 0.5, gazebo: 0.3 }, trees: { pine: 4, cypress: 2, round: 1, palm: 1.5 }, people: 1 },
  light:   { must: ['lighthouse'], fill: { tree: 2, bush: 2, cottage: 1.2, house: 0.6 }, trees: { pine: 2, round: 1, palm: 2 }, people: 1 },
  temple:  { must: ['pagoda', 'pagoda'], fill: { tree: 3, stall: 1, obelisk: 1, bush: 1, rotunda: 0.8, gazebo: 1, ruins: 0.5 }, trees: { cherry: 4, round: 1, pine: 1 }, people: 2 },
  observ:  { must: ['dome', 'tower'], fill: { tree: 2, house: 1, bush: 1, obelisk: 1, rotunda: 0.8, clocktower: 0.4 }, trees: { pine: 3, cypress: 2 }, people: 1 }
};
// Tirage pondéré dans { clé: poids }
function pickW(r, weights) {
  const e = Object.entries(weights);
  let t = e.reduce((a, [, w]) => a + w, 0) * r();
  for (const [k, w] of e) { t -= w; if (t <= 0) return k; }
  return e[e.length - 1][0];
}

function buildIslands() {
  // x, alt = hauteur au-dessus de l'horizon (fraction de H), size = largeur (fraction de U) ;
  // shape : tp = finesse du cône (grand = bol arrondi), yp = profondeur du profil, depth, amp = relief de la surface,
  //         spikes = stalactites ; fall = côté d'une cascade (-1 gauche, 1 droite, 0 aucune)
  const defs = [
    { x: 0.42, alt: 0.37, size: 0.21, haze: 0.00, theme: 'castle',  fall: 0,  shape: { tp: 1.0, yp: 0.85, depth: 62, amp: 1.0, spikes: 0.15 } },
    { x: 0.71, alt: 0.43, size: 0.13, haze: 0.10, theme: 'village', fall: 0,  shape: { tp: 1.7, yp: 0.72, depth: 44, amp: 0.5, spikes: 0.0 } },
    { x: 0.17, alt: 0.31, size: 0.12, haze: 0.12, theme: 'farm',    fall: -1, shape: { tp: 0.85, yp: 1.0, depth: 70, amp: 1.2, spikes: 0.3 } },
    { x: 0.89, alt: 0.31, size: 0.07, haze: 0.28, theme: 'forest',  fall: 1,  shape: { tp: 2.1, yp: 0.62, depth: 36, amp: 0.7, spikes: 0.0 } },
    { x: 0.58, alt: 0.25, size: 0.06, haze: 0.30, theme: 'light',   fall: -1, shape: { tp: 1.2, yp: 0.9,  depth: 58, amp: 1.4, spikes: 0.45 } },
    { x: 0.07, alt: 0.47, size: 0.06, haze: 0.30, theme: 'temple',  fall: 1,  shape: { tp: 1.4, yp: 0.8,  depth: 50, amp: 0.4, spikes: 0.2 } },
    { x: 0.29, alt: 0.50, size: 0.05, haze: 0.38, theme: 'observ',  fall: 0,  shape: { tp: 0.9, yp: 0.95, depth: 66, amp: 1.0, spikes: 0.3 } }
  ];
  islands = defs.map((d, n) => {
    const r = rng(1000 + n * 977);
    const s = d.size * U / 100;                    // échelle local -> pixels
    const sh = d.shape, depth = sh.depth + r() * 6;
    const th = THEMES[d.theme];
    const hill = x => sh.amp * (-3.2 * Math.sin(x * 0.08 + n) - 1.4 * Math.sin(x * 0.21 + n * 2));

    // Corps : surface vallonnée puis rocher dont le profil dépend de la forme choisie
    const body = new Path2D(), under = [];
    body.moveTo(-50, 0);
    for (let x = -50; x <= 50; x += 5) body.lineTo(x, hill(x));
    const tipX = (r() - 0.5) * 8, steps = 8;
    const edgeX = (side, t) => lerp(50 * side, tipX, Math.pow(t, sh.tp));
    const edgeY = t => depth * Math.pow(t, sh.yp);
    for (let k = 1; k <= steps; k++) {                                   // côté droit, de haut en bas
      const t = k / steps, x = edgeX(1, t) - r() * 6 * (1 - t) * 0.6, y = edgeY(t) + (r() - 0.5) * 3;
      body.lineTo(x, y); under.push({ x, y });
      if (k < steps && r() < sh.spikes) body.lineTo(x - 2.5, y + 4 + r() * 7);   // stalactite
    }
    for (let k = steps - 1; k >= 1; k--) {                               // côté gauche, de bas en haut
      const t = k / steps, x = edgeX(-1, t) + r() * 6 * (1 - t) * 0.6, y = edgeY(t) + (r() - 0.5) * 3;
      if (r() < sh.spikes) body.lineTo(x + 2.5, y + 4 + r() * 7);
      body.lineTo(x, y); under.push({ x, y });
    }
    body.closePath();
    const grass = new Path2D();                                          // bande d'herbe (ou de neige) sur la surface
    grass.moveTo(-50, hill(-50));
    for (let x = -50; x <= 50; x += 5) grass.lineTo(x, hill(x));
    for (let x = 50; x >= -50; x -= 5) grass.lineTo(x, hill(x) + 1.9);
    grass.closePath();

    // Peuplement
    const structs = new Path2D(), trees = [], bldgs = [], wins = [], lamps = [];
    const anim = { mills: [], flags: [], chimneys: [], beacons: [], clocks: [] };
    // Fenêtres et lanternes : chacune a un seuil « thr » d'allumage, donc la ville
    // s'illumine petit à petit au fil du crépuscule, pas toutes d'un coup
    const addWins = (cx, y, w, h, cols, rows) => {
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++)
        wins.push({ x: cx - w / 2 + (w / cols) * (i + 0.5) - 0.8, y: y - h + 2.5 + j * ((h - 4) / rows), thr: 0.02 + r() * 0.8 });
    };
    const addLamp = (x, y) => lamps.push({ x, y, thr: 0.02 + r() * 0.8, ph: r() * 6.28 });
    const chimney = (x, base) => { structs.rect(x - 0.6, base - 4, 1.2, 4.5); anim.chimneys.push({ x, y: base - 4, ph: r() * 6.28 }); };
    const flag = (x, y, len = 3.6) => { structs.rect(x - 0.2, y - 5, 0.4, 5.5); anim.flags.push({ x: x + 0.2, y: y - 5, len, ph: r() * 6.28 }); };

    const B = {
      house(cx, y) {                                                      // maison : six formes de toit, annexe éventuelle
        const w = 6.5 + r() * 3, h = 6 + r() * 7, pk = 4.5 + r() * 2.5, roof = (r() * 6) | 0;
        structs.rect(cx - w / 2, y - h, w, h + 2);
        switch (roof) {
          case 0: structs.moveTo(cx - w / 2 - 1, y - h); structs.lineTo(cx + (r() < 0.3 ? w * 0.18 : 0), y - h - pk); structs.lineTo(cx + w / 2 + 1, y - h); structs.closePath(); break;   // à deux pans
          case 1: structs.moveTo(cx - w / 2 - 1, y - h); structs.lineTo(cx - w / 2 + 1.6, y - h - pk * 0.7); structs.lineTo(cx + w / 2 - 1.6, y - h - pk * 0.7); structs.lineTo(cx + w / 2 + 1, y - h); structs.closePath(); break;   // en croupe
          case 2: structs.rect(cx - w / 2 - 0.6, y - h - 1.2, w + 1.2, 1.4); for (let i = 0; i < 3; i++) structs.rect(cx - w / 2 - 0.6 + i * (w + 0.4) / 2.2, y - h - 2.4, (w + 1.2) / 4.4, 1.3); break;   // toit plat à créneaux
          case 3: structs.moveTo(cx - w / 2 - 1, y - h); structs.lineTo(cx - w / 2 - 1, y - h - pk * 0.35); structs.lineTo(cx + w / 2 + 1, y - h - pk * 0.9); structs.lineTo(cx + w / 2 + 1, y - h); structs.closePath(); break;   // à un pan
          case 4: structs.moveTo(cx - w / 2 - 1, y - h); structs.ellipse(cx, y - h, w / 2 + 1, pk * 0.8, 0, Math.PI, Math.PI * 2); structs.closePath(); break;   // toit de chaume arrondi
          default: structs.moveTo(cx - w / 2 - 1, y - h); structs.lineTo(cx - w / 2 + 0.8, y - h - pk * 0.55); structs.lineTo(cx - w * 0.18, y - h - pk);
                   structs.lineTo(cx + w * 0.18, y - h - pk); structs.lineTo(cx + w / 2 - 0.8, y - h - pk * 0.55); structs.lineTo(cx + w / 2 + 1, y - h); structs.closePath();   // mansardé
        }
        if (w < 7.8 && r() < 0.5) {                                                  // annexe basse accolée
          const sd = r() < 0.5 ? -1 : 1, ax = cx + sd * (w / 2 + 1.3);
          structs.rect(ax - 1.3, y - h * 0.5, 2.6, h * 0.5 + 2);
          structs.moveTo(ax - 1.9, y - h * 0.5); structs.lineTo(ax, y - h * 0.5 - 2.2); structs.lineTo(ax + 1.9, y - h * 0.5); structs.closePath();
        }
        if (roof !== 4 && r() < 0.55) chimney(cx + (r() < 0.5 ? -1 : 1) * w * 0.25, y - h - (roof === 2 ? 1 : pk * 0.55));
        bldgs.push({ x: cx, y, w, h });
        addWins(cx, y, w, h, Math.max(1, Math.floor((w - 1) / 3.5)), h > 9 ? 2 : 1);
        addLamp(cx + w / 2 + 1.8, y - 3);
      },
      longhouse(cx, y) {                                                  // longère basse à toit en croupe
        const w = 12 + r() * 3, h = 5 + r() * 2;
        structs.rect(cx - w / 2, y - h, w, h + 2);
        structs.moveTo(cx - w / 2 - 1.2, y - h); structs.lineTo(cx - w / 2 + 1.8, y - h - 3.4);
        structs.lineTo(cx + w / 2 - 1.8, y - h - 3.4); structs.lineTo(cx + w / 2 + 1.2, y - h); structs.closePath();
        if (r() < 0.5) chimney(cx + w * 0.25, y - h - 3);
        bldgs.push({ x: cx, y, w, h });
        addWins(cx, y, w, h, Math.floor(w / 3.6), 1);
        addLamp(cx - w / 2 - 1.6, y - 3);
      },
      tower(cx, y) {                                                      // tour : flèche, dôme en oignon ou créneaux
        const w = 4 + r() * 2, h = 18 + r() * 24, kind = r();
        structs.rect(cx - w / 2, y - h, w, h + 2);
        structs.rect(cx - w / 2 - 1, y - h - 2, w + 2, 3);
        if (kind < 0.55) {
          structs.moveTo(cx - w / 2 - 1.5, y - h - 2); structs.lineTo(cx, y - h - 13); structs.lineTo(cx + w / 2 + 1.5, y - h - 2); structs.closePath();
          if (r() < 0.6) flag(cx, y - h - 13); else structs.rect(cx - 0.25, y - h - 18, 0.5, 6);
          addLamp(cx, y - h - 14);
        } else if (kind < 0.8) {
          ell(structs, cx, y - h - 5, w * 0.85, 3.6);
          structs.moveTo(cx - 1, y - h - 7.5); structs.lineTo(cx, y - h - 12); structs.lineTo(cx + 1, y - h - 7.5); structs.closePath();
          addLamp(cx, y - h - 6);
        } else {
          for (let i = 0; i < 3; i++) structs.rect(cx - w / 2 - 1 + i * ((w + 2) / 2.3), y - h - 4, (w + 2) / 4.2, 2.2);
          flag(cx, y - h - 4);
        }
        bldgs.push({ x: cx, y, w, h, tower: true });
        addWins(cx, y, w, h, 1, Math.max(1, Math.floor((h - 4) / 7)));
      },
      keep(cx, y) {                                                       // donjon crénelé flanqué de deux tourelles
        const w = 12 + r() * 2, h = 13 + r() * 6, tn = 6, tw = w / (2 * tn - 1);
        structs.rect(cx - w / 2, y - h, w, h + 2);
        for (let i = 0; i < tn; i++) structs.rect(cx - w / 2 + 2 * i * tw, y - h - 1.8, tw, 1.9);
        for (const sx of [-1, 1]) {
          const tx = cx + sx * (w / 2 + 0.4);
          structs.rect(tx - 1.7, y - h - 5, 3.4, h + 7);
          structs.moveTo(tx - 2.3, y - h - 5); structs.lineTo(tx, y - h - 11); structs.lineTo(tx + 2.3, y - h - 5); structs.closePath();
          addLamp(tx, y - h - 11.5);
        }
        flag(cx, y - h - 1.8, 4.2);
        bldgs.push({ x: cx, y, w, h });
        addWins(cx, y, w - 2, h - 1, 3, Math.max(1, Math.floor(h / 6)));
      },
      chapel(cx, y) {                                                     // nef + clocher surmonté d'une croix
        structs.rect(cx - 4.2, y - 6, 6.2, 8);
        structs.moveTo(cx - 5.2, y - 6); structs.lineTo(cx - 1.1, y - 10.5); structs.lineTo(cx + 3, y - 6); structs.closePath();
        structs.rect(cx + 1.4, y - 15, 3, 17);
        structs.moveTo(cx + 0.6, y - 15); structs.lineTo(cx + 2.9, y - 20.5); structs.lineTo(cx + 5.2, y - 15); structs.closePath();
        bldgs.push({ x: cx, y, w: 9, h: 6 });
        addWins(cx - 1, y, 6, 6, 2, 1);
        addLamp(cx + 5.8, y - 3); addLamp(cx + 2.9, y - 12);
      },
      windmill(cx, y) {                                                   // moulin : les pales tournent (voir drawIslandLife)
        structs.moveTo(cx - 3.2, y + 1.5); structs.lineTo(cx - 1.9, y - 13); structs.lineTo(cx + 1.9, y - 13); structs.lineTo(cx + 3.2, y + 1.5); structs.closePath();
        structs.moveTo(cx - 2.6, y - 13); structs.lineTo(cx, y - 17); structs.lineTo(cx + 2.6, y - 13); structs.closePath();
        anim.mills.push({ x: cx, y: y - 11.2, ph: r() * 6.28, dir: r() < 0.5 ? 1 : -1, sp: 0.8 + r() * 0.5 });
        bldgs.push({ x: cx, y, w: 6, h: 13 });
        addWins(cx, y, 3.4, 8, 1, 1);
        addLamp(cx + 4.4, y - 2.5);
      },
      pagoda(cx, y) {                                                     // pagode à trois toits retroussés
        structs.rect(cx - 5, y - 1.2, 10, 3.2);
        let yb = y - 1.2;
        for (let t = 0; t < 3; t++) {
          const bw = 9 - t * 2.2, top = yb - 3.2;
          structs.rect(cx - bw * 0.32, top, bw * 0.64, 3.4);
          structs.moveTo(cx - bw * 0.85, top + 0.4);
          structs.quadraticCurveTo(cx - bw * 0.3, top - 0.1, cx, top - 2.6);
          structs.quadraticCurveTo(cx + bw * 0.3, top - 0.1, cx + bw * 0.85, top + 0.4);
          structs.closePath();
          addWins(cx, yb, bw * 0.64, 3.2, 1, 1);
          if (t < 2) { addLamp(cx - bw * 0.8, top + 0.9); addLamp(cx + bw * 0.8, top + 0.9); }
          yb = top - 2.2;
        }
        structs.rect(cx - 0.25, yb - 5, 0.5, 6.5);
        bldgs.push({ x: cx, y, w: 10, h: 16 });
      },
      dome(cx, y) {                                                       // observatoire : dôme à fente éclairée
        structs.rect(cx - 4.5, y - 7, 9, 9);
        structs.moveTo(cx - 4.8, y - 7); structs.ellipse(cx, y - 7, 4.8, 4.8, 0, Math.PI, Math.PI * 2); structs.closePath();
        structs.rect(cx + 4.4, y - 4, 3, 6);
        structs.rect(cx - 0.25, y - 14.6, 0.5, 2.2);
        wins.push({ x: cx - 0.8, y: y - 11.2, thr: 0.05 + r() * 0.3 });
        bldgs.push({ x: cx, y, w: 9, h: 12 });
        addWins(cx, y, 9, 7, 2, 1);
        addLamp(cx - 6, y - 3);
      },
      lighthouse(cx, y) {                                                 // phare : faisceau tournant la nuit
        structs.moveTo(cx - 2.8, y + 1.5); structs.lineTo(cx - 1.9, y - 26); structs.lineTo(cx + 1.9, y - 26); structs.lineTo(cx + 2.8, y + 1.5); structs.closePath();
        structs.rect(cx - 3.2, y - 27.4, 6.4, 1.5);
        structs.rect(cx - 1.9, y - 31.6, 3.8, 4.4);
        structs.moveTo(cx - 2.8, y - 31.6); structs.lineTo(cx, y - 36); structs.lineTo(cx + 2.8, y - 31.6); structs.closePath();
        anim.beacons.push({ x: cx, y: y - 29.4, ph: r() * 6.28 });
        bldgs.push({ x: cx, y, w: 6, h: 36 });
        addWins(cx, y, 3.6, 20, 1, 2);
        addLamp(cx, y - 29.4);
      },
      townhouse(cx, y) {                                                  // maison de ville étroite à pignon à gradins
        const w = 5 + r() * 1.5, h = 12 + r() * 5, st = 3, L = [[cx - w / 2, y - h]];
        for (let i = 0; i < st; i++) {
          const xa = cx - w / 2 + i * (w / 2) / st, xb = cx - w / 2 + (i + 1) * (w / 2) / st, ya = y - h - (i + 1) * 1.7;
          L.push([xa, ya], [xb, ya]);
        }
        const R = L.slice(0, -1).reverse().map(([px, py]) => [2 * cx - px, py]);
        structs.rect(cx - w / 2, y - h, w, h + 2);
        L.concat(R).forEach(([px, py], i) => i ? structs.lineTo(px, py) : structs.moveTo(px, py));
        structs.closePath();
        bldgs.push({ x: cx, y, w, h });
        addWins(cx, y, w, h, w > 5.8 ? 2 : 1, Math.max(2, Math.floor(h / 4.2)));
        addLamp(cx + w / 2 + 1.5, y - 3);
      },
      hall(cx, y) {                                                       // grand hall : nef centrale haute et deux ailes
        const cw = 6, ww = 4.6, ch = 10 + r() * 2, wh = 6 + r() * 1.5;
        structs.rect(cx - cw / 2, y - ch, cw, ch + 2);
        structs.moveTo(cx - cw / 2 - 0.8, y - ch); structs.lineTo(cx, y - ch - 5); structs.lineTo(cx + cw / 2 + 0.8, y - ch); structs.closePath();
        for (const sx of [-1, 1]) {
          const wx = cx + sx * (cw / 2 + ww / 2 - 0.2);
          structs.rect(wx - ww / 2, y - wh, ww, wh + 2);
          structs.moveTo(wx - ww / 2 - 0.6, y - wh); structs.lineTo(wx, y - wh - 2.8); structs.lineTo(wx + ww / 2 + 0.6, y - wh); structs.closePath();
          addWins(wx, y, ww, wh, 1, 1);
        }
        if (r() < 0.6) chimney(cx + (r() < 0.5 ? -1 : 1) * 1.6, y - ch - 2.4);
        bldgs.push({ x: cx, y, w: 15, h: ch });
        addWins(cx, y, cw, ch, 2, 2);
        addLamp(cx, y - 3);
      },
      rotunda(cx, y) {                                                    // rotonde à dôme et lanternon
        structs.rect(cx - 5, y - 0.8, 10, 2.8);
        structs.rect(cx - 4, y - 6, 8, 6);
        structs.moveTo(cx - 4.5, y - 6); structs.ellipse(cx, y - 6, 4.5, 4.2, 0, Math.PI, Math.PI * 2); structs.closePath();
        structs.rect(cx - 0.7, y - 11.6, 1.4, 1.8);
        structs.moveTo(cx - 1.1, y - 11.6); structs.lineTo(cx, y - 13.6); structs.lineTo(cx + 1.1, y - 11.6); structs.closePath();
        bldgs.push({ x: cx, y, w: 8, h: 10 });
        addWins(cx, y, 8, 6, 3, 1);
        addLamp(cx - 5.6, y - 2); addLamp(cx + 5.6, y - 2);
      },
      silo(cx, y) {                                                       // deux silos reliés par une conduite
        for (const sx of [cx - 2.6, cx + 2.6]) {
          structs.rect(sx - 1.8, y - 11, 3.6, 13);
          structs.moveTo(sx - 2.2, y - 11); structs.lineTo(sx, y - 14.6); structs.lineTo(sx + 2.2, y - 11); structs.closePath();
        }
        structs.rect(cx - 2.6, y - 9, 5.2, 0.5);
        bldgs.push({ x: cx, y, w: 9, h: 11 });
        addLamp(cx, y - 3);
      },
      cottage(cx, y) {                                                    // chaumière : toit de chaume bombé
        structs.rect(cx - 3.6, y - 4.5, 7.2, 6.5);
        structs.moveTo(cx - 4.8, y - 4.5); structs.ellipse(cx, y - 4.5, 4.8, 3.4, 0, Math.PI, Math.PI * 2); structs.closePath();
        if (r() < 0.7) chimney(cx + 2, y - 7);
        bldgs.push({ x: cx, y, w: 7, h: 6 });
        addWins(cx, y, 7.2, 5.5, 2, 1);
        addLamp(cx + 4.8, y - 2.6);
      },
      clocktower(cx, y) {                                                 // tour de l'horloge : cadran qui indique l'heure
        const w = 5, h = 20 + r() * 6;
        structs.rect(cx - w / 2, y - h, w, h + 2);
        structs.rect(cx - w / 2 - 0.5, y - h - 4, w + 1, 4);
        structs.moveTo(cx - w / 2 - 1.2, y - h - 4); structs.lineTo(cx, y - h - 11); structs.lineTo(cx + w / 2 + 1.2, y - h - 4); structs.closePath();
        anim.clocks.push({ x: cx, y: y - h + 4.6 });
        bldgs.push({ x: cx, y, w, h });
        addWins(cx, y, w, h - 8, 1, Math.max(1, Math.floor((h - 8) / 6)));
        addLamp(cx, y - h - 11.5);
      },
      ruins(cx, y) {                                                      // ruines : colonnes brisées et bloc effondré
        for (let i = 0; i < 4; i++) {
          const xi = cx - 5 + i * 3.2, hi = 3 + r() * 6;
          structs.rect(xi - 0.7, y - hi, 1.4, hi + 2);
          if (r() < 0.6) structs.rect(xi - 1, y - hi - 0.6, 2, 0.7);
        }
        structs.rect(cx + 5, y - 1.2, 2.4, 1.6);
      },
      gazebo(cx, y) {                                                     // kiosque à toit conique
        structs.rect(cx - 3.2, y - 4.5, 0.5, 4.8); structs.rect(cx + 2.7, y - 4.5, 0.5, 4.8);
        structs.rect(cx - 3.8, y - 0.3, 7.6, 0.8);
        structs.moveTo(cx - 4.4, y - 4.5); structs.lineTo(cx, y - 8.6); structs.lineTo(cx + 4.4, y - 4.5); structs.closePath();
        addLamp(cx, y - 3.8);
      },
      barn(cx, y) {                                                       // grange à toit mansardé
        const w = 13 + r(), h = 7;
        structs.rect(cx - w / 2, y - h, w, h + 2);
        structs.moveTo(cx - w / 2 - 1, y - h); structs.lineTo(cx - w / 2 + 1.2, y - h - 3.2); structs.lineTo(cx, y - h - 5);
        structs.lineTo(cx + w / 2 - 1.2, y - h - 3.2); structs.lineTo(cx + w / 2 + 1, y - h); structs.closePath();
        bldgs.push({ x: cx, y, w, h });
        addWins(cx, y, w, h, 2, 1);
        addLamp(cx - w / 2 - 1.6, y - 3);
      },
      stall(cx, y) {                                                      // étal de marché sous auvent
        structs.rect(cx - 2.2, y - 3, 0.4, 3.2); structs.rect(cx + 1.8, y - 3, 0.4, 3.2);
        structs.moveTo(cx - 3.2, y - 3); structs.lineTo(cx, y - 5); structs.lineTo(cx + 3.2, y - 3); structs.closePath();
        structs.rect(cx - 2.2, y - 1.4, 4.4, 1.6);
        addLamp(cx, y - 2.6);
      },
      obelisk(cx, y) {
        structs.moveTo(cx - 0.8, y + 1); structs.lineTo(cx - 0.6, y - 8); structs.lineTo(cx, y - 10); structs.lineTo(cx + 0.6, y - 8); structs.lineTo(cx + 0.8, y + 1); structs.closePath();
        structs.rect(cx - 1.4, y - 0.8, 2.8, 1.8);
      },
      fence(cx, y) {                                                      // clôture de pré
        for (let x = cx - 4; x <= cx + 4.01; x += 1.8) structs.rect(x - 0.2, hill(x) - 2, 0.4, 2.4);
        structs.rect(cx - 4, hill(cx) - 1.7, 8, 0.35);
      },
      bush(cx) { trees.push({ type: 'bush', tint: 0, x: cx, y: hill(cx), sc: 0.9 + r() * 0.4, ph: r() * 6.28 }); },
      tree(cx) {
        const tk = pickW(r, th.trees), cherry = tk === 'cherry', type = cherry ? 'round' : tk;
        const count = r() < 0.3 ? 2 : 1, [lo, hi] = TREE_SCALE[type];
        for (let i = 0; i < count; i++) {
          const x = cx + (i - (count - 1) / 2) * 3.4 + (r() - 0.5);
          trees.push({ type, tint: cherry ? 1 : (type === 'round' && r() < 0.12 ? 2 : 0),   // 1 = cerisier rose, 2 = feuillage d'automne
                       x, y: hill(x), sc: lo + r() * (hi - lo), ph: r() * 6.28 });
          if (r() < 0.3) addLamp(x + 2.5, hill(x) - 6);
        }
      }
    };

    // Disposition : éléments obligatoires + remplissage tiré au sort, mélangés puis répartis sur la largeur
    const cap = d.size >= 0.12 ? 80 : d.size >= 0.07 ? 66 : 48;
    const kinds = th.must.slice();
    let used = kinds.reduce((a, k) => a + WIDTH[k], 0);
    for (let tries = 0; tries < 16; tries++) {
      const k = pickW(r, th.fill);
      if (used + WIDTH[k] + 1.5 <= cap) { kinds.push(k); used += WIDTH[k]; }
    }
    for (let i = kinds.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
    const gap = Math.max(0.8, (cap - used) / (kinds.length + 1));
    let cursor = -cap / 2 + gap;
    for (const k of kinds) {
      const cx = cursor + WIDTH[k] / 2;
      B[k](cx, hill(cx));
      cursor += WIDTH[k] + gap;
    }
    // Poteaux-lanternes aux deux extrémités (points d'attache des ponts)
    for (const ex of [-45, 45]) { structs.rect(ex - 0.3, hill(ex) - 5, 0.6, 5.5); addLamp(ex, hill(ex) - 5.5); }

    // Habitants qui se promènent sur la surface (positions mises à jour dans updateLife)
    const people = Math.round(th.people * clamp(d.size / 0.15, 0.25, 1));
    const walkers = Array.from({ length: people }, () => ({
      x: -34 + r() * 68, dir: r() < 0.5 ? -1 : 1, v: 1.1 + r() * 1.1, pause: r() * 4, ph: r() * 6.28, lo: -38, hi: 38
    }));
    // Lianes qui pendent sous le rocher
    const vines = Array.from({ length: Math.round(2 + d.size * 20) }, () => {
      const u = under[(r() * under.length) | 0];
      return { x: u.x, y: u.y, len: 8 + r() * 18, ph: r() * 6.28 };
    });
    // Cascade qui tombe du bord de l'île
    const falls = d.fall ? [{ x: d.fall * 47.5, y: hill(d.fall * 47.5) + 0.5, side: d.fall, len: 55 + r() * 45 }] : [];

    return {
      id: n, edgeL: hill(-45), edgeR: hill(45), wins, lamps, hill, grass, anim, walkers, vines, falls,
      x: d.x * W, y: HZ - d.alt * H, s, depth, haze: d.haze, body, structs, trees, bldgs,
      ph: r() * 6.28, f: 0.35 + r() * 0.35,        // phase et fréquence du flottement
      bobAmp: (0.004 + d.size * 0.02) * H          // amplitude : les grandes îles bougent un peu plus
    };
  });
  islands.sort((a, b) => b.haze - a.haze);          // les plus lointaines d'abord

  // Ponts suspendus : paires d'îles voisines (identifiants de `defs`), avec des passants qui les traversent
  const byId = id => islands.find(i => i.id === id);
  bridges = [[0, 1], [0, 2], [1, 3]].map(([a, b], k) => {
    let A = byId(a), B = byId(b);
    if (A.x > B.x) [A, B] = [B, A];                 // A à gauche, B à droite
    const r = rng(4000 + k);
    return { A, B, ph: k * 1.7, walkers: Array.from({ length: 2 }, () => ({
      t: r(), dir: r() < 0.5 ? -1 : 1, v: 1 / (45 + r() * 40), pause: r() * 5
    })) };
  });
}

// Position écran d'un point local d'une île (tient compte du flottement et du roulis)
function anchor(isl, lx, ly) {
  const bob  = Math.sin(T * isl.f + isl.ph) * isl.bobAmp * cfg.floatAmp;
  const tilt = Math.sin(T * isl.f * 0.7 + isl.ph * 1.3) * 0.012 * cfg.floatAmp;
  const c = Math.cos(tilt), s = Math.sin(tilt);
  return [isl.x + (lx * c - ly * s) * isl.s, isl.y + bob + (lx * s + ly * c) * isl.s];
}

// Pont suspendu : tablier courbe, main courante, suspentes et lanternes
function drawBridge(br, sky) {
  const [x0, y0] = anchor(br.A, 45, br.A.edgeR - 3);
  const [x1, y1] = anchor(br.B, -45, br.B.edgeL - 3);
  const dist = Math.hypot(x1 - x0, y1 - y0);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + dist * 0.2 + Math.sin(bridgePh + br.ph) * dist * (0.004 + windK * 0.012);
  const col = mix(sky.sil, sky.hor, (br.A.haze + br.B.haze) / 2);
  const lw = Math.max(0.8, U * 0.0012), rail = U * 0.009;
  const pt = t => [
    (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1,
    (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1
  ];
  ctx.strokeStyle = rgb(col);
  ctx.lineWidth = lw * 2.4;                                   // tablier
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
  ctx.lineWidth = lw;                                         // main courante
  ctx.beginPath(); ctx.moveTo(x0, y0 - rail); ctx.quadraticCurveTo(cx, cy - rail, x1, y1 - rail); ctx.stroke();
  ctx.lineWidth = lw * 0.7;                                   // suspentes
  const n = Math.max(4, Math.round(dist / 16));
  ctx.beginPath();
  for (let i = 1; i < n; i++) { const p = pt(i / n); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0], p[1] - rail); }
  ctx.stroke();
  [0.2, 0.4, 0.6, 0.8].forEach((t, i) => {                   // lanternes sur le pont
    const p = pt(t), thr = 0.1 + ((i * 37 + br.ph * 10) % 7) * 0.1;
    const flick = 0.85 + 0.15 * Math.sin(T * (4 + i) + br.ph * 9);
    glow(p[0], p[1] - rail, U * 0.011, clamp((lamp - thr) * 5, 0, 1) * flick);
  });
  // Passants : petites silhouettes qui traversent le pont d'une île à l'autre (lanterne en main la nuit)
  const u = U * 0.0026, dim = 1 - (br.A.haze + br.B.haze) * 0.25;
  ctx.fillStyle = rgb(mix(col, sky.hor, 0.12));
  for (const w of br.walkers) {
    const p = pt(w.t), step = w.pause > 0 ? 0 : Math.abs(Math.sin(T * 5 + w.t * 40)) * u * 0.12;
    ctx.fillRect(p[0] - u * 0.25, p[1] - u * 1.9 - step, u * 0.5, u * 1.7);
    ctx.beginPath(); ctx.arc(p[0], p[1] - u * 2.3 - step, u * 0.34, 0, 6.2832); ctx.fill();
    if (lamp > 0.2) glow(p[0] + w.dir * u * 0.8, p[1] - u * 1.2, U * 0.008, clamp((lamp - 0.2) * 3, 0, 1) * dim);
  }
}

function buildStars() {
  const r = rng(77);
  const tints = ['255,255,240', '190,210,255', '255,222,185'];   // blanc, bleuté, doré
  stars = Array.from({ length: 450 }, () => {
    const big = r(), bright = big < 0.03;
    return {
      x: r() * W, y: Math.pow(r(), 1.3) * HZ * 0.95,
      s: bright ? 2.2 : big < 0.22 ? 1.5 : 1,
      b: bright ? 1 : 0.35 + r() * 0.5,                          // luminosité propre
      glare: bright,                                             // les plus brillantes ont une croix de lumière
      cs: tints[(r() * 3) | 0], ph: r() * 6.28, sp: 0.8 + r() * 2
    };
  });

  // Voie lactée : bande diagonale pré-rendue (nébulosité douce + poussière d'étoiles)
  mwCanvas = document.createElement('canvas');
  mwCanvas.width = Math.round(W); mwCanvas.height = Math.round(HZ);
  const c = mwCanvas.getContext('2d');
  c.translate(W * 0.55, HZ * 0.32); c.rotate(-0.5);
  const band = (half, rgba) => {
    const g = c.createLinearGradient(0, -half, 0, half);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, rgba); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(-W * 1.2, -half, W * 2.4, half * 2);
  };
  band(H * 0.22, 'rgba(120,145,230,0.14)');
  band(H * 0.09, 'rgba(255,225,200,0.10)');
  for (let i = 0; i < 2200; i++) {                                // poussière d'étoiles concentrée dans la bande
    const dy = (r() + r() + r() - 1.5) * H * 0.16;
    c.fillStyle = `rgba(255,245,230,${(0.1 + r() * 0.4).toFixed(2)})`;
    c.fillRect((r() * 2 - 1) * W * 1.1, dy, 1, 1);
  }
  c.setTransform(1, 0, 0, 1, 0, 0);                               // fondu vers l'horizon
  c.globalCompositeOperation = 'destination-out';
  const m = c.createLinearGradient(0, HZ * 0.6, 0, HZ);
  m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(1, 'rgba(0,0,0,1)');
  c.fillStyle = m; c.fillRect(0, 0, W, HZ);
}

/* --------------------------------------------------------------------------
   7. HEURE VIRTUELLE
   -------------------------------------------------------------------------- */
let extraHours = 0;     // avance accumulée quand le cycle est accéléré
let hourShown = null;   // heure affichée (lissée pour éviter les sauts)

function realHour() {
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600 + d.getMilliseconds() / 3.6e6;
}

function updateHour(dt) {
  extraHours += dt * (cfg.cycleSpeed - 1) / 3600;
  const target = cfg.testMode ? cfg.testHour : ((realHour() + extraHours) % 24 + 24) % 24;
  if (hourShown === null) { hourShown = target; return; }
  // Rapprochement par le plus court chemin sur le cercle de 24 h
  const d = ((target - hourShown + 36) % 24) - 12;
  hourShown = ((hourShown + d * (1 - Math.exp(-dt * 2.5))) % 24 + 24) % 24;
}

/* --------------------------------------------------------------------------
   8. DESSIN
   -------------------------------------------------------------------------- */
let T = 0;  // temps d'animation en secondes

function drawFrame(sky, hour) {
  ctx.setTransform(cfg.renderScale, 0, 0, cfg.renderScale, 0, 0);
  // la ville s'allume quand le ciel s'assombrit (et un peu pendant les orages)
  lamp = Math.max(lampBase, 0.5 * Math.max(wth.storm, wth.rain * 0.6));

  /* --- Position du soleil et de la lune (arcs de cercle) --- */
  const sunAng  = (hour - 6) / 13 * Math.PI;                  // lever 6h, coucher 19h
  const moonAng = (((hour - 19) % 24 + 24) % 24) / 12 * Math.PI; // lever 19h, coucher 7h
  const sunAlt  = Math.sin(sunAng), moonAlt = Math.sin(moonAng);
  const sunX  = W * (0.5 - Math.cos(sunAng) * 0.38),  sunY  = HZ - sunAlt  * H * 0.50;
  const moonX = W * (0.5 - Math.cos(moonAng) * 0.38), moonY = HZ - moonAlt * H * 0.46;
  // Recouvrement réel du soleil / de la lune par les nuages (0 = dégagé, 1 = totalement caché)
  const sunCover = coverAt(sunX, Math.min(sunY, HZ)), moonCover = coverAt(moonX, moonY);

  /* --- Ciel --- */
  let g = ctx.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, rgb(sky.top));
  g.addColorStop(1, rgb(sky.hor));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, HZ + 2);

  /* --- Étoiles (visibles seulement la nuit, scintillent doucement) --- */
  if (sky.star > 0.01) {
    ctx.globalAlpha = sky.star * 0.8;                          // voie lactée
    ctx.drawImage(mwCanvas, 0, 0, W, HZ);
    ctx.globalAlpha = 1;
    for (const s of stars) {
      const fade = 1 - clamp(s.y / HZ, 0, 1) * 0.8;           // moins visibles près de l'horizon
      const a = sky.star * fade * s.b * (0.55 + 0.45 * Math.sin(T * s.sp + s.ph));
      ctx.fillStyle = `rgba(${s.cs},${a.toFixed(3)})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
      if (s.glare) {                                           // petite croix de lumière
        ctx.fillRect(s.x - 4, s.y + s.s / 2 - 0.4, s.s + 8, 0.8);
        ctx.fillRect(s.x + s.s / 2 - 0.4, s.y - 4, 0.8, s.s + 8);
      }
    }
    // Étoile filante : apparaît toutes les 9 à 23 s, seulement en pleine nuit
    if (!shoot && T > nextShoot && sky.star > 0.7) {
      shoot = { x: (0.15 + shootRng() * 0.7) * W, y: shootRng() * HZ * 0.4, a: 0.35 + shootRng() * 0.3, t0: T };
      nextShoot = T + 9 + shootRng() * 14;
    }
    if (shoot) {
      const p = (T - shoot.t0) / 0.9;
      if (p >= 1) shoot = null;
      else {
        const dx = Math.cos(shoot.a), dy = Math.sin(shoot.a), d = W * 0.2 * p, len = W * 0.1 * Math.min(1, p * 4);
        const hx = shoot.x + dx * d, hy = shoot.y + dy * d;
        g = ctx.createLinearGradient(hx - dx * len, hy - dy * len, hx, hy);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(1, `rgba(255,255,255,${(0.9 * (1 - p)).toFixed(2)})`);
        ctx.strokeStyle = g; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(hx - dx * len, hy - dy * len); ctx.lineTo(hx, hy); ctx.stroke();
      }
    }
  }

  /* --- Halo du soleil : intense à l'horizon, discret en plein jour --- */
  const glowK = clamp((sunAlt + 0.35) / 0.35, 0, 1) * (1 - clamp(sunAlt, 0, 1) * 0.8) * (1 - wth.cloud * 0.55) * (1 - sunCover * 0.6);
  if (glowK > 0.01) {
    const gx = sunX, gy = Math.min(sunY, HZ);
    g = ctx.createRadialGradient(gx, gy, 0, gx, gy, W * 0.55);
    g.addColorStop(0, rgb(sky.glow, 0.75 * glowK));
    g.addColorStop(0.35, rgb(sky.glow, 0.28 * glowK));
    g.addColorStop(1, rgb(sky.glow, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, HZ + 2);
  }

  /* --- Soleil --- */
  if (sunAlt > -0.12) {
    const r = H * 0.032;
    ctx.globalAlpha = (1 - wth.cloud * 0.75) * (1 - sunCover * 0.85);   // voilé, puis caché par les nuages
    g = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, r * 5);
    g.addColorStop(0, rgb(mix(sky.glow, [255, 255, 255], 0.6), 1));
    g.addColorStop(0.2, rgb(sky.glow, 0.9));
    g.addColorStop(1, rgb(sky.glow, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sunX, sunY, r * 5, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* --- Lune : halo + disque + quelques cratères --- */
  if (moonAlt > -0.12) {
    const r = H * 0.036, vis = clamp(sky.star * 1.2, 0, 1);   // s'estompe en plein jour
    const ph  = cfg.moonPhase >= 0 ? cfg.moonPhase : moonPhaseNow();
    const k   = Math.cos(ph * 2 * Math.PI);                    // 1 = nouvelle, -1 = pleine
    const lit = (1 - k) / 2;                                   // fraction éclairée
    ctx.globalAlpha = vis;
    g = ctx.createRadialGradient(moonX, moonY, r * 0.5, moonX, moonY, r * 8);
    g.addColorStop(0, `rgba(190,210,255,${0.12 + 0.3 * lit})`);
    g.addColorStop(1, 'rgba(190,210,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(moonX, moonY, r * 8, 0, 6.2832); ctx.fill();

    ctx.save();
    ctx.translate(moonX, moonY);
    ctx.fillStyle = 'rgba(48,58,96,0.85)';                    // face sombre (lumière cendrée)
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
    // Face éclairée : limbe droit + terminateur elliptique (croissant ou gibbeuse)
    const lp = new Path2D();
    lp.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
    if (k > 0) lp.ellipse(0, 0, k * r, r, 0, Math.PI / 2, -Math.PI / 2, true);
    else       lp.ellipse(0, 0, -k * r, r, 0, Math.PI / 2, Math.PI * 1.5, false);
    ctx.fillStyle = '#f2efe2';
    if (ph > 0.5) ctx.scale(-1, 1);                          // lune décroissante : côté gauche éclairé
    ctx.fill(lp);
    ctx.clip(lp);
    if (ph > 0.5) ctx.scale(-1, 1);                          // les mers lunaires gardent leur orientation
    ctx.fillStyle = 'rgba(150,155,175,0.42)';                 // mers lunaires et cratères
    for (const [dx, dy, rx, ry] of [[-0.32, -0.25, 0.3, 0.22], [0.22, -0.12, 0.24, 0.2], [-0.1, 0.3, 0.26, 0.18], [0.38, 0.3, 0.14, 0.12], [-0.5, 0.1, 0.12, 0.1]]) {
      ctx.beginPath(); ctx.ellipse(dx * r, dy * r, rx * r, ry * r, 0.4, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* --- Nuages, éclairs et créatures du ciel (derrière montagnes et îles) --- */
  drawClouds(sky);
  drawLightning();
  drawJellies(sky);
  drawBirds(sky);
  drawDragon(sky);

  /* --- Montagnes lointaines et moyennes (derrière les îles) --- */
  const mtnFill = m => {
    const c = mix(sky.sil, sky.hor, clamp(m.haze + wth.fog * 0.5, 0, 0.95));   // le brouillard estompe le relief
    const gr = ctx.createLinearGradient(0, HZ - m.amp, 0, HZ);
    gr.addColorStop(0, rgb(c));
    gr.addColorStop(1, rgb(mix(c, sky.hor, 0.55)));          // la brume monte du lac
    return gr;
  };
  for (let i = 0; i < 2; i++) { ctx.fillStyle = mtnFill(mountains[i]); ctx.fill(mountains[i].path); }

  /* --- Îles flottantes --- */
  for (const isl of islands) drawIsland(isl, sky);
  for (const br of bridges) drawBridge(br, sky);

  /* --- Rive proche --- */
  ctx.fillStyle = mtnFill(mountains[2]);
  ctx.fill(mountains[2].path);

  /* --- Lac --- */
  // Eau franchement bleue (turquoise le jour, bleu nuit la nuit) : la teinte de l'eau prend le dessus sur celle du ciel,
  // sauf sous les nuages et le brouillard où elle redevient plus terne
  const dayW = clamp(1 - sky.star, 0, 1), wk = 0.62 * (1 - 0.45 * wth.cloud - 0.3 * wth.fog);
  const lakeTop = mix(sky.hor, mix([16, 46, 92], [52, 150, 200], dayW), wk);
  const lakeBot = mix(sky.top, mix([6, 20, 56], [14, 76, 146], dayW), wk + 0.12);
  g = ctx.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, rgb(lakeTop));
  g.addColorStop(1, rgb(lakeBot));
  ctx.fillStyle = g;
  ctx.fillRect(0, HZ, W, H - HZ);

  // Reflets des montagnes et des îles (retournés autour de l'horizon)
  ctx.save();
  ctx.beginPath(); ctx.rect(0, HZ, W, H - HZ); ctx.clip();
  ctx.translate(0, 2 * HZ); ctx.scale(1, -1);
  ctx.globalAlpha = 0.38;
  for (let i = 0; i < 3; i++) { ctx.fillStyle = mtnFill(mountains[i]); ctx.fill(mountains[i].path); }
  ctx.globalAlpha = 0.34;
  for (const isl of islands) drawIsland(isl, sky);
  for (const br of bridges) drawBridge(br, sky);
  ctx.restore();

  // Reflet du soleil / de la lune : traînée scintillante
  const lightSrc = sunAlt > -0.05 && glowK + sunAlt > 0.02
    ? { x: sunX, k: clamp(sunAlt * 3 + 0.4, 0, 1) * (1 - wth.cloud * 0.7) * (1 - sunCover * 0.8), c: mix(sky.glow, [255, 255, 255], 0.35), r: H * 0.03 }
    : moonAlt > 0 ? { x: moonX, k: 0.55 * clamp(sky.star * 1.2, 0, 1), c: [200, 215, 255], r: H * 0.026 } : null;
  if (lightSrc && lightSrc.k > 0.02) {
    ctx.globalCompositeOperation = 'lighter';
    const n = 44;
    for (let i = 0; i < n; i++) {
      const u = i / n, y = HZ + 3 + Math.pow(u, 1.7) * (H - HZ);
      const w = lightSrc.r * (1.2 + u * 5) * (0.55 + 0.45 * Math.sin(T * 1.7 + i * 1.9));
      const x = lightSrc.x + Math.sin(T * 0.9 + i * 2.3) * (4 + u * 14);
      ctx.fillStyle = rgb(lightSrc.c, 0.38 * lightSrc.k * (1 - u * 0.65));
      ctx.fillRect(x - w / 2, y, w, 1.5 + u * 2.5);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // Ondulations : lignes pointillées qui défilent lentement
  const rip = mix(sky.hor, [255, 255, 255], 0.35);
  for (let j = 0; j < 38; j++) {
    const u = j / 38, y = HZ + 6 + u * u * (H - HZ - 6);
    ctx.lineWidth = 0.8 + u * 2;
    ctx.strokeStyle = rgb(rip, 0.07 + u * 0.05);
    ctx.setLineDash([14 + u * 70, 40 + u * 170]);
    ctx.lineDashOffset = -T * (6 + u * 26) * (j % 2 ? 1 : -1) + j * 41;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.setLineDash([]);

  /* --- Barques, sillages et reflets --- */
  drawBoats(sky);
  drawMonster(sky);

  /* --- Particules d'ambiance et rayons de lumière --- */
  drawParticles(sky);
  // Des rayons n'existent que si le soleil est visible : ils s'effacent quand un nuage le recouvre
  // et disparaissent avec un ciel couvert, la pluie, le brouillard ou l'orage
  const sunRay = clamp((sunAlt + 0.1) / 0.15, 0, 1) * (0.4 + 0.6 * (1 - clamp(sunAlt, 0, 1))) *
                 (1 - sunCover) * clamp(1 - wth.cloud * 2.2, 0, 1) *      // plus aucun rayon dès ~45 % de nuages
                 clamp(1 - wth.rain - wth.fog * 0.6 - wth.storm, 0, 1);
  rayK += (sunRay - rayK) * (1 - Math.exp(-frameDt * 2));                 // apparition / disparition en douceur
  drawRays(sunX, Math.min(sunY, HZ), rayK, sky.glow, H * 0.95);
  if (moonAlt > 0) drawRays(moonX, moonY, 0.3 * clamp(sky.star * 1.2, 0, 1) * (1 - moonCover) * clamp(1 - wth.cloud * 1.15 - wth.rain, 0, 1), [190, 210, 255], H * 0.8);

  /* --- Voile de brume à l'horizon (fond les montagnes dans le lac) --- */
  const bh = H * 0.07;
  g = ctx.createLinearGradient(0, HZ - bh, 0, HZ + bh);
  g.addColorStop(0, rgb(sky.hor, 0));
  g.addColorStop(0.5, rgb(sky.hor, 0.5));
  g.addColorStop(1, rgb(sky.hor, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, HZ - bh, W, bh * 2);

  /* --- Météo au premier plan : brouillard, pluie, neige, flash d'orage sur le lac --- */
  drawFog(sky);
  drawPrecip(sky);
  if (flash > 0.03) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(170,190,255,${(flash * 0.1).toFixed(3)})`;
    ctx.fillRect(0, HZ, W, H - HZ);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* --- Vignettage léger pour donner de la profondeur --- */
  g = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.45, W / 2, H * 0.55, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,10,${0.28 + sky.star * 0.14})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* --- Texture peinte (en dernier : elle recouvre toute l'image) --- */
  drawPaint();
}

// Exécute fn avec un état de dessin sauvegardé, restauré même si fn plante
function inState(fn) { ctx.save(); try { fn(); } finally { ctx.restore(); } }

// Dessine une île avec son flottement, sa végétation et ses habitants
function drawIsland(isl, sky) {
  const amp  = cfg.floatAmp;
  const bob  = Math.sin(T * isl.f + isl.ph) * isl.bobAmp * amp;           // haut / bas
  const tilt = Math.sin(T * isl.f * 0.7 + isl.ph * 1.3) * 0.012 * amp;    // léger roulis

  const hz = clamp(isl.haze + wth.fog * 0.45, 0, 0.95);                   // le brouillard estompe les îles
  const col = mix(sky.sil, sky.hor, hz);
  const dayK = clamp(1 - sky.star, 0, 1), snowK = clamp(wth.snow * 1.2, 0, 0.85);
  ctx.save();
  ctx.translate(isl.x, isl.y + bob);
  ctx.rotate(tilt);
  ctx.scale(isl.s, isl.s);

  drawFalls(isl, sky);                                                    // cascade, derrière le rocher

  // Dégradé : surface nette, base du rocher fondue dans la brume
  const gr = ctx.createLinearGradient(0, -30, 0, isl.depth);
  gr.addColorStop(0, rgb(mix(col, sky.glow, 0.10)));
  gr.addColorStop(0.4, rgb(col));
  gr.addColorStop(1, rgb(mix(col, sky.hor, 0.45)));
  ctx.fillStyle = gr;
  ctx.fill(isl.body);
  // Herbe le jour, neige quand il neige
  ctx.fillStyle = rgb(mix(mix(col, [84, 140, 86], 0.4 * dayK * (1 - hz)), [236, 242, 250], snowK * (0.5 + 0.5 * dayK)));
  ctx.fill(isl.grass);
  ctx.fillStyle = gr;
  ctx.fill(isl.structs);
  drawVines(isl, col, dayK);

  // Arbres : balancement léger (cisaillement horizontal qui croît avec la hauteur), selon l'essence
  const base = mix(col, sky.top, 0.06), tk = 0.55 * dayK * (1 - hz) * (1 - snowK);
  for (const t of isl.trees) {
    const ty = TREE_TYPES[t.type];
    // une oscillation principale + une plus lente, amplitude croissante avec le vent
    const sway = (Math.sin(swayPh + t.ph + t.x * 0.1) * (0.035 + windK * 0.07) + Math.sin(swayPh * 0.43 + t.ph * 1.7) * 0.02) * ty.sw;
    ctx.fillStyle = rgb(t.tint === 1 ? mix(base, [236, 134, 176], tk) : t.tint === 2 ? mix(base, [214, 126, 56], tk) : base);
    ctx.save();
    ctx.translate(t.x, t.y + 0.5);
    ctx.transform(t.sc, 0, sway * t.sc, t.sc, 0, 0);
    ctx.fill(ty.path);
    ctx.restore();
  }

  drawIslandLife(isl, sky, col, dayK, 1 - isl.haze * 0.5);                // moulins, fumée, drapeaux, habitants, phare

  // Lumières de la ville : fenêtres puis lanternes, allumées progressivement
  if (lamp > 0.01) {
    const ga = ctx.globalAlpha, dim = 1 - isl.haze * 0.5;
    ctx.fillStyle = '#ffc870';
    for (const w of isl.wins) {
      const on = clamp((lamp - w.thr) * 5, 0, 1);
      if (on <= 0) continue;
      ctx.globalAlpha = ga * on * dim;
      ctx.fillRect(w.x, w.y, 1.6, 2.2);
    }
    ctx.globalAlpha = ga;
    for (const l of isl.lamps) {
      const flick = 0.85 + 0.15 * Math.sin(T * (4 + l.ph) + l.ph * 9);   // vacillement de la flamme
      glow(l.x, l.y, 10, clamp((lamp - l.thr) * 5, 0, 1) * flick * dim);
    }
  }
  ctx.restore();
}

/* --------------------------------------------------------------------------
   Vie sur les îles
   -------------------------------------------------------------------------- */
let millPh = 0, flagPh = 0;                              // phases cumulées (moulins, drapeaux)

// Pales de moulin : quatre bras avec leurs toiles, dessinés une fois en polygones tournés
const BLADES = new Path2D();
for (let k = 0; k < 4; k++) {
  const a = k * Math.PI / 2, c = Math.cos(a), s = Math.sin(a);
  const poly = pts => pts.forEach(([x, y], i) => i ? BLADES.lineTo(x * c - y * s, x * s + y * c) : BLADES.moveTo(x * c - y * s, x * s + y * c));
  poly([[0.8, -0.3], [8.6, -0.3], [8.6, 0.3], [0.8, 0.3]]); BLADES.closePath();       // bras
  poly([[2.2, 0.3], [8.4, 0.3], [8.4, 2.5], [2.2, 2.1]]); BLADES.closePath();         // toile
}

// Cascade : filet d'eau qui tombe du bord de l'île et s'efface dans la brume
function drawFalls(isl, sky) {
  if (!isl.falls.length) return;
  const w = mix(sky.hor, [255, 255, 255], 0.55);
  for (const f of isl.falls) {
    const L = f.len, ex = f.x + f.side * 3 + windK * 9;
    const g = ctx.createLinearGradient(0, f.y, 0, f.y + L);
    g.addColorStop(0, rgb(w, 0.6)); g.addColorStop(1, rgb(w, 0));
    ctx.strokeStyle = g; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.quadraticCurveTo(f.x + f.side * 1.5, f.y + L * 0.4, ex, f.y + L);
    ctx.lineWidth = 2.4; ctx.globalAlpha *= 0.45; ctx.stroke();                 // voile d'eau
    ctx.globalAlpha /= 0.45;
    ctx.lineWidth = 0.9; ctx.setLineDash([5, 3.5]); ctx.lineDashOffset = -T * 16; ctx.stroke();   // filets qui coulent
    ctx.setLineDash([]); ctx.lineCap = 'butt';
  }
}

// Lianes qui pendent sous le rocher et se balancent avec le vent
function drawVines(isl, col, dayK) {
  ctx.strokeStyle = rgb(mix(col, [70, 120, 72], 0.3 * dayK));
  ctx.lineWidth = 0.45;
  ctx.beginPath();
  for (const v of isl.vines) {
    ctx.moveTo(v.x, v.y);
    for (let k = 1; k <= 5; k++)
      ctx.lineTo(v.x + Math.sin(swayPh * 0.9 + v.ph + k * 0.7) * (0.4 + windK * 1.6) * k * 0.35, v.y + k * v.len / 5);
  }
  ctx.stroke();
}

function drawIslandLife(isl, sky, col, dayK, dim) {
  const A = isl.anim, dark = mix(col, sky.top, 0.04);

  // Moulins : les pales tournent plus vite avec le vent
  ctx.fillStyle = rgb(dark);
  for (const m of A.mills) inState(() => { ctx.translate(m.x, m.y); ctx.rotate(millPh * m.sp * m.dir + m.ph); ctx.fill(BLADES); });

  // Drapeaux : tissu ondulant, rouge le jour
  ctx.fillStyle = rgb(mix(col, [196, 62, 56], 0.5 * dayK * (isl.haze < 0.35 ? 1 : 0.4)));
  for (const f of A.flags) {
    const amp = 0.55 * (0.6 + windK * 1.6), n = 5;
    ctx.beginPath(); ctx.moveTo(f.x, f.y);
    for (let i = 1; i <= n; i++) { const u = i / n; ctx.lineTo(f.x + u * f.len, f.y + Math.sin(flagPh + u * 4 + f.ph) * amp * u); }
    for (let i = n; i >= 0; i--) { const u = i / n; ctx.lineTo(f.x + u * f.len, f.y + 1.8 * (1 - u * 0.25) + Math.sin(flagPh + u * 4 + f.ph) * amp * u); }
    ctx.fill();
  }

  // Horloges : cadran pâle le jour, éclairé la nuit, aiguilles réglées sur l'heure affichée
  for (const c of A.clocks) {
    const on = clamp((lamp - 0.1) * 3, 0, 1);
    ctx.fillStyle = rgb(mix(mix(col, [238, 232, 212], 0.55 * dayK), [255, 205, 120], on));
    ctx.beginPath(); ctx.arc(c.x, c.y, 1.9, 0, 6.2832); ctx.fill();
    const ah = (hourShown % 12) / 12 * 6.2832 - 1.5708, am = (hourShown % 1) * 6.2832 - 1.5708;
    ctx.strokeStyle = rgb(mix(col, [20, 20, 30], 0.6)); ctx.lineWidth = 0.28;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(ah) * 0.95, c.y + Math.sin(ah) * 0.95);
    ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(am) * 1.45, c.y + Math.sin(am) * 1.45);
    ctx.stroke();
  }

  // Fumée des cheminées : volutes grises qui montent et dérivent avec le vent
  const smoke = mix(col, [205, 208, 218], 0.55), calm = 1 - wth.rain * 0.7;
  for (const c of A.chimneys) {
    for (let i = 0; i < 5; i++) {
      const u = (T * 0.1 + i / 5 + c.ph) % 1;
      ctx.fillStyle = rgb(smoke, (1 - u) * 0.34 * calm * dim);
      ctx.beginPath();
      ctx.arc(c.x + Math.sin(u * 7 + c.ph * 3) * 1.0 + windK * u * 10, c.y - u * 16, 0.8 + u * 2.2, 0, 6.2832);
      ctx.fill();
    }
  }

  // Habitants : petites silhouettes qui marchent, avec une lanterne la nuit
  ctx.fillStyle = rgb(mix(col, sky.hor, 0.12));
  for (const w of isl.walkers) {
    const y = isl.hill(w.x) - Math.abs(Math.sin(T * 5 + w.ph)) * (w.pause > 0 ? 0 : 0.22);
    ctx.fillRect(w.x - 0.45, y - 2.7, 0.9, 2.5);
    ctx.beginPath(); ctx.arc(w.x, y - 3.3, 0.6, 0, 6.2832); ctx.fill();
  }
  if (lamp > 0.1) for (const w of isl.walkers) glow(w.x + w.dir * 0.9, isl.hill(w.x) - 1.6, 5, clamp((lamp - 0.2) * 3, 0, 1) * dim);

  // Phare : faisceau qui balaie, plus long quand il pointe de côté
  if (lamp > 0.05) for (const b of A.beacons) {
    const cs = Math.cos(T * 0.7 + b.ph), len = 8 + 70 * Math.abs(cs), sg = cs >= 0 ? 1 : -1;
    const a = (0.12 + 0.5 * Math.abs(cs)) * clamp(lamp * 1.5, 0, 1) * dim;
    const g = ctx.createLinearGradient(b.x, 0, b.x + sg * len, 0);
    g.addColorStop(0, `rgba(255,236,190,${a.toFixed(3)})`); g.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(b.x, b.y - 0.7); ctx.lineTo(b.x + sg * len, b.y - 1.2 - Math.abs(cs) * 3.5); ctx.lineTo(b.x + sg * len, b.y + 1.2 + Math.abs(cs) * 3.5); ctx.lineTo(b.x, b.y + 0.7);
    ctx.fill(); ctx.globalCompositeOperation = 'source-over';
  }
}

// Met en mouvement les habitants des îles et les passants des ponts
function updateLife(dt) {
  millPh += dt * (0.5 + windK * 3);
  flagPh += dt * (3 + windK * 6);
  for (const isl of islands) for (const w of isl.walkers) {
    if (w.pause > 0) { w.pause -= dt; continue; }
    w.x += w.dir * w.v * dt;
    if (w.x < w.lo || w.x > w.hi) { w.x = clamp(w.x, w.lo, w.hi); w.dir = -w.dir; w.pause = 2 + crR() * 6; }
    else if (crR() < dt * 0.08) w.pause = 1.5 + crR() * 4;          // pauses au hasard
  }
  for (const br of bridges) for (const w of br.walkers) {
    if (w.pause > 0) { w.pause -= dt; continue; }
    w.t += w.dir * w.v * dt;
    if (w.t < 0 || w.t > 1) { w.t = clamp(w.t, 0, 1); w.dir = -w.dir; w.pause = 2 + crR() * 5; }
  }
}

/* ==========================================================================
   8b. MÉTÉO (Open-Meteo, sans clé API)
   ========================================================================== */
const CLEAR = { cloud: 0.1, rain: 0, snow: 0, fog: 0, storm: 0, wind: 0.15 };   // ciel de secours
const PRESETS = {                                                               // pour le mode test
  clear:  CLEAR,
  partly: { cloud: 0.35, rain: 0, snow: 0, fog: 0, storm: 0, wind: 0.2 },
  cloudy: { cloud: 0.9,  rain: 0,   snow: 0,   fog: 0,   storm: 0, wind: 0.3  },
  fog:    { cloud: 0.5,  rain: 0,   snow: 0,   fog: 1,   storm: 0, wind: 0.05 },
  rain:   { cloud: 0.95, rain: 0.7, snow: 0,   fog: 0.1, storm: 0, wind: 0.3  },
  storm:  { cloud: 1,    rain: 1,   snow: 0,   fog: 0,   storm: 1, wind: 0.7  },
  snow:   { cloud: 0.85, rain: 0,   snow: 0.8, fog: 0.15, storm: 0, wind: 0.2 },
  wind:   { cloud: 0.35, rain: 0,   snow: 0,   fog: 0,   storm: 0, wind: 1    }
};
const wth  = { ...CLEAR };     // météo affichée (rejoint la cible en douceur)
const wthT = { ...CLEAR };     // météo cible (issue de l'API ou du mode test)
let windK = 0.15;              // vent instantané avec rafales (0 à 1)
// Phases d'oscillation CUMULÉES : on ajoute dt * fréquence à chaque image. Écrire sin(T * f(vent))
// faisait « sauter » la phase dès que le vent variait (et de plus en plus avec le temps), d'où les vibrations.
let swayPh = 0, bridgePh = 0, fogPh = 0;
let wxInfo = 'météo : ciel clair (défaut)';
const wx = { on: true, auto: true, city: '', test: 'auto', lastOk: 0, retry: null, deb: null };
{ const t = new URLSearchParams(location.search).get('weather'); if (t) wx.test = t; }

// Code météo WMO d'Open-Meteo -> intensités des effets
function codeToTarget(code, cover, windKmh) {
  const t = { cloud: cover / 100 * 0.85, rain: 0, snow: 0, fog: 0, storm: 0, wind: clamp(windKmh / 45, 0, 1) };
  if (code === 45 || code === 48) { t.fog = 1; t.cloud = Math.max(t.cloud, 0.5); }
  else if (code >= 51 && code <= 57) { t.rain = 0.3; t.cloud = Math.max(t.cloud, 0.8); }
  else if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) {
    t.rain = (code === 61 || code === 80) ? 0.5 : (code === 63 || code === 81) ? 0.75 : 1;
    t.cloud = Math.max(t.cloud, 0.9);
  }
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
    t.snow = (code === 71 || code === 77 || code === 85) ? 0.45 : 0.85;
    t.cloud = Math.max(t.cloud, 0.85);
  }
  else if (code >= 95) { t.rain = 0.95; t.storm = 1; t.cloud = 1; t.wind = Math.max(t.wind, 0.5); }
  return t;
}

async function fetchJSON(url, ms = 8000) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

// Localisation : 1) navigateur, 2) IP, 3) dernière position connue
const geoBrowser = () => new Promise((ok, ko) => {
  if (!navigator.geolocation) return ko(new Error('pas de géolocalisation'));
  navigator.geolocation.getCurrentPosition(
    p => ok({ lat: p.coords.latitude, lon: p.coords.longitude, place: 'position GPS' }), ko,
    { timeout: 4000, maximumAge: 36e5 });
});
async function geoIP() {
  try {
    const j = await fetchJSON('https://ipwho.is/');
    if (j.success !== false && j.latitude != null) return { lat: j.latitude, lon: j.longitude, place: j.city };
  } catch (e) { /* on tente le second service */ }
  const j = await fetchJSON('https://ipapi.co/json/');
  if (j.latitude == null) throw new Error('IP non localisée');
  return { lat: j.latitude, lon: j.longitude, place: j.city };
}
async function geoCity(name) {
  const j = await fetchJSON('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name=' + encodeURIComponent(name));
  const r = j.results && j.results[0];
  if (!r) throw new Error('ville introuvable');
  return { lat: r.latitude, lon: r.longitude, place: r.name };
}
async function locate() {
  if (!wx.auto && wx.city.trim()) { try { return await geoCity(wx.city.trim()); } catch (e) { /* retombe sur l'auto */ } }
  for (const f of [geoBrowser, geoIP]) {
    try { const l = await f(); try { localStorage.setItem('cf_loc', JSON.stringify(l)); } catch (e) {} return l; } catch (e) {}
  }
  try { const l = JSON.parse(localStorage.getItem('cf_loc')); if (l && l.lat != null) return l; } catch (e) {}
  throw new Error('aucune localisation');
}

async function refreshWeather() {
  clearTimeout(wx.retry);
  if (!wx.on) { Object.assign(wthT, CLEAR); wxInfo = 'météo désactivée'; return; }
  if (wx.test !== 'auto' && PRESETS[wx.test]) { Object.assign(wthT, PRESETS[wx.test]); wxInfo = 'test : ' + wx.test; return; }
  try {
    const loc = await locate();
    const j = await fetchJSON('https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon +
      '&current=weather_code,cloud_cover,wind_speed_10m&wind_speed_unit=kmh&timezone=auto');
    const c = j.current;
    Object.assign(wthT, codeToTarget(c.weather_code, c.cloud_cover, c.wind_speed_10m));
    wx.lastOk = Date.now();
    wxInfo = (loc.place || '?') + ' · code ' + c.weather_code + ' · ' + Math.round(c.wind_speed_10m) + ' km/h';
  } catch (e) {
    // Mode de secours : ciel clair si on n'a pas de donnée récente (moins d'1 h)
    if (Date.now() - wx.lastOk > 3600e3) Object.assign(wthT, CLEAR);
    wxInfo = 'météo indisponible (secours)';
    wx.retry = setTimeout(refreshWeather, 120000);
  }
}
const scheduleRefresh = () => { clearTimeout(wx.deb); wx.deb = setTimeout(refreshWeather, 600); };
setInterval(refreshWeather, 15 * 60 * 1000);                      // actualisation toutes les 15 min

// Assombrit et grise le ciel selon la météo (étoiles masquées sous les nuages)
function applyWeather(sky) {
  const g = clamp(wth.cloud * 0.45 + wth.rain * 0.3 + wth.snow * 0.15 + wth.fog * 0.25, 0, 0.8);
  const dark = 0.9 - wth.storm * 0.35 - wth.rain * 0.1;
  const grey = c => { const l = (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) * dark; return mix(c, [l * 0.98, l, l * 1.05], g); };
  sky.top = grey(sky.top); sky.hor = grey(sky.hor); sky.glow = grey(sky.glow);
  sky.star *= 1 - clamp(wth.cloud * 1.1, 0, 1) * 0.9;
}

/* --------------------------------------------------------------------------
   Nuages (sprites doux, deux teintes : ombre dessous, lumière dessus)
   -------------------------------------------------------------------------- */
const mkCanvas = n => { const c = document.createElement('canvas'); c.width = c.height = n; return c; };
const cloudSprite = mkCanvas(128), cloudLitC = mkCanvas(128), cloudShadeC = mkCanvas(128);
{
  const c = cloudSprite.getContext('2d'), g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.45, 'rgba(255,255,255,0.65)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 128, 128);
}
function tintSprite(dst, col) {
  const c = dst.getContext('2d');
  c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, 128, 128);
  c.fillStyle = rgb(col); c.fillRect(0, 0, 128, 128);
  c.globalCompositeOperation = 'destination-in'; c.drawImage(cloudSprite, 0, 0);
}
let clouds = [];
function buildClouds() {
  const r = rng(555);
  clouds = Array.from({ length: 22 }, () => {
    const n = 5 + (r() * 3 | 0), sc = U * 0.0012 * (0.7 + r() * 1.1);
    const blobs = Array.from({ length: n }, (_, k) => ({
      dx: (k - (n - 1) / 2) * 34 + (r() - 0.5) * 10,
      dy: -Math.sin(k / (n - 1) * Math.PI) * 16 * r(),
      r: 38 + r() * 28 - Math.abs(k - (n - 1) / 2) * 4
    }));
    return { x: (r() * 1.4 - 0.2) * W, y: (0.05 + r() * 0.33) * H, sc, ext: n * 40 * sc,
             v: 4 + r() * 8, th: r() * 0.9, blobs };
  });
}
// Opacité des nuages au point (x, y) : sert à savoir si le soleil ou la lune est vraiment caché
function coverAt(x, y) {
  let cover = 0;
  for (const c of clouds) {
    const a = clamp((wth.cloud - c.th) * 3, 0, 1) * 0.9;
    if (a <= 0.01 || Math.abs(x - c.x) > c.ext || Math.abs(y - c.y) > c.ext) continue;
    for (const b of c.blobs) {
      const dx = (x - (c.x + b.dx * c.sc)) / (b.r * c.sc * 0.95);
      const dy = (y - (c.y + b.dy * c.sc)) / (b.r * c.sc * 0.6);
      const d = dx * dx + dy * dy;
      if (d < 1) cover = Math.max(cover, a * (1 - d));
    }
  }
  return Math.min(1, cover * 1.6);
}
function drawClouds(sky) {
  if (wth.cloud < 0.03) return;
  const dayK = 1 - sky.star;
  let lit = mix(mix(sky.hor, sky.glow, 0.25), [255, 255, 255], 0.5 * dayK);
  lit = mix(lit, [58, 62, 76], clamp(wth.storm * 0.55 + wth.rain * 0.25, 0, 0.7));
  tintSprite(cloudShadeC, mix(lit, sky.sil, 0.5));
  tintSprite(cloudLitC, lit);
  for (const c of clouds) {
    const a = clamp((wth.cloud - c.th) * 3, 0, 1) * 0.9;
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    for (const b of c.blobs) {
      const s = b.r * 2 * c.sc;
      ctx.drawImage(cloudShadeC, c.x + b.dx * c.sc - s / 2, c.y + (b.dy + b.r * 0.25) * c.sc - s * 0.31, s, s * 0.62);
    }
    for (const b of c.blobs) {
      const s = b.r * 1.75 * c.sc;
      ctx.drawImage(cloudLitC, c.x + b.dx * c.sc - s / 2, c.y + (b.dy - b.r * 0.08) * c.sc - s * 0.31, s, s * 0.62);
    }
  }
  ctx.globalAlpha = 1;
}

/* --------------------------------------------------------------------------
   Orage : éclairs + flash, pluie, neige, brouillard
   -------------------------------------------------------------------------- */
let bolt = null, flash = 0, nextBolt = 4;
const crR = rng((Date.now() ^ 0x5bd1e995) >>> 0);      // graine liée à l'heure de lancement : formations différentes à chaque fois
const boltFlash = a => a < 0.07 ? 1 : a < 0.13 ? 0.2 : a < 0.22 ? 0.95 : Math.exp(-(a - 0.22) * 5);

function spawnBolt() {
  const k = H / 1080, bx = (0.1 + crR() * 0.8) * W, end = HZ - H * 0.02;
  const pts = [[bx, H * 0.05]];
  let x = bx, y = H * 0.05;
  while (y < end) { y = Math.min(end, y + (10 + crR() * 22) * k); x += (crR() - 0.5) * 40 * k; pts.push([x, y]); }
  const br = [];
  for (let n = 0; n < 3; n++) {                        // branches secondaires
    const s = pts[(2 + crR() * (pts.length - 4)) | 0], b = [s], dx = (crR() - 0.5) * 2;
    let bx2 = s[0], by2 = s[1];
    for (let j = 0; j < 5; j++) { by2 += (10 + crR() * 16) * k; bx2 += dx * 14 + (crR() - 0.5) * 14; b.push([bx2, by2]); }
    br.push(b);
  }
  bolt = { pts, br, t0: T };
}
function drawLightning() {
  if (!bolt || flash < 0.03) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(190,205,255,${(flash * 0.3).toFixed(3)})`;
  ctx.fillRect(0, 0, W, HZ + 2);
  if (T - bolt.t0 < 0.45) {
    ctx.lineJoin = 'round';
    for (const [w, a] of [[10, 0.12], [4, 0.35], [1.6, 1]]) {
      ctx.lineWidth = w; ctx.strokeStyle = `rgba(215,225,255,${(a * flash).toFixed(3)})`;
      ctx.beginPath();
      bolt.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      for (const b of bolt.br) b.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

const RAIN_N = 800, SNOW_N = 500;
let rain = [], snow = [], ripples = [], rippleAcc = 0;
function buildPrecip() {
  const r = rng(909);
  rain = Array.from({ length: RAIN_N }, () => ({ x: r() * W, y: r() * H, v: 0.7 + r() * 0.6, l: r() }));
  snow = Array.from({ length: SNOW_N }, () => ({ x: r() * W, y: r() * H, v: 0.5 + r() * 0.8, ph: r() * 6.28, s: 1.5 + r() * 2 }));
  ripples = [];
}
function updatePrecip(dt) {
  const k = H / 1080;
  if (wth.rain > 0.02) {
    const n = Math.floor(RAIN_N * wth.rain), slant = 0.1 + windK * 0.4, sp = H * 1.1;
    for (let i = 0; i < n; i++) {
      const d = rain[i];
      d.y += d.v * sp * dt; d.x += d.v * sp * dt * slant;
      if (d.y > H) { d.y -= H + 40; d.x = crR() * W; }
      if (d.x > W) d.x -= W;
    }
    rippleAcc += dt * 45 * wth.rain;                   // gouttes qui frappent le lac
    while (rippleAcc >= 1 && ripples.length < 60) {
      rippleAcc -= 1;
      const u = Math.pow(crR(), 0.8);
      ripples.push({ x: crR() * W, y: HZ + 8 + u * (H - HZ - 8), u, age: 0, life: 0.6 + crR() * 0.5 });
    }
    rippleAcc = Math.min(rippleAcc, 2);
  }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].age += dt; if (ripples[i].age > ripples[i].life) ripples.splice(i, 1); }
  if (wth.snow > 0.02) {
    const n = Math.floor(SNOW_N * wth.snow);
    for (let i = 0; i < n; i++) {
      const f = snow[i];
      f.y += f.v * 55 * k * dt;
      f.x += (Math.sin(T * 0.8 + f.ph) * 18 + windK * 110) * k * dt;
      if (f.y > H) { f.y -= H + 10; f.x = crR() * W; }

}

}

/* ==========================================================================
   8c. BATEAUX SUR LE LAC (6 types) ET MONSTRE MARIN

const mkPath = f => { const p = new Path2D(); f(p); return p; };
// Type 0 : voilier (grand-voile à l'arrière, foc à l'avant) — la proue est à droite
const HULL = mkPath(p => { p.moveTo(-10, -2); p.lineTo(11, -3.2); p.quadraticCurveTo(8, 2, 0, 2.4); p.quadraticCurveTo(-7, 2, -10, -2); p.closePath(); });

const CABIN = mkPath(p => p.rect(-6.5, -5.2, 4.2, 2.8));

const YARD   = mkPath(p => { p.moveTo(-9.8, -4.1); p.lineTo(0.8, -18.8); });
// Type 2 : galion à trois mâts, voiles carrées, château arrière et beaupré
const GAL_MAST = [[-6.5, -19], [0, -25], [6.5, -20]];
const HULL_G = mkPath(p => {
  p.moveTo(-12, -6.2); p.lineTo(-9, -6.2); p.lineTo(-8.4, -3.5); p.lineTo(10, -3.9); p.lineTo(13, -5.6);
  p.quadraticCurveTo(11, 2.4, 0, 2.8); p.quadraticCurveTo(-9, 2.6, -12, -3); p.closePath();
});

  for (const [x, top] of GAL_MAST) {
    p.rect(x - 0.3, top, 0.6, -top - 3);
    p.moveTo(x + 0.3, top); p.lineTo(x + 3.2, top + 0.9); p.lineTo(x + 0.3, top + 1.8); p.closePath();   // fanion
  }
  p.moveTo(12, -5); p.lineTo(17, -8); p.lineTo(17, -7.4); p.lineTo(12, -4.4); p.closePath();               // beaupré
});
const G_SAILS = mkPath(p => { for (const [x, top] of GAL_MAST) { p.rect(x - 3.2, top + 2.2, 6.4, 6); p.rect(x - 3.8, top + 9, 7.6, 6.2); } });
// Type 3 : barque à rames avec rameur et lanterne sur perche
const HULL_R = mkPath(p => { p.moveTo(-7, -1.8); p.lineTo(8, -2.6); p.quadraticCurveTo(5, 1.6, 0, 1.8); p.quadraticCurveTo(-5, 1.6, -7, -1.8); p.closePath(); });
const ROWER  = mkPath(p => { p.rect(-2, -5.8, 1.6, 4); ell(p, -1.2, -6.6, 0.9, 0.9); p.rect(6.2, -9, 0.5, 7); });
// Type 4 : gondole effilée, gondolier debout à l'arrière, petite cabine
const HULL_Q = mkPath(p => {
  p.moveTo(-15, -5.2); p.quadraticCurveTo(-10, -1.5, -6, -1.6); p.lineTo(8, -1.6); p.quadraticCurveTo(13, -1.5, 16, -6.2);
  p.quadraticCurveTo(10, 1.4, 0, 1.5); p.quadraticCurveTo(-10, 1.4, -15, -5.2); p.closePath();

const FELZE = mkPath(p => { p.rect(-1.5, -4.2, 5.6, 2.8); p.moveTo(-1.5, -4.2); p.ellipse(1.3, -4.2, 2.8, 1.6, 0, Math.PI, Math.PI * 2); p.closePath(); });
const GONDOLIER = mkPath(p => { p.rect(-9.4, -9, 1.1, 7.4); ell(p, -8.85, -9.9, 0.8, 0.8); });
// Type 5 : péniche chargée de caisses, avec cabine et cheminée qui fume
const HULL_B = mkPath(p => { p.moveTo(-11, -2.4); p.lineTo(12, -2.4); p.lineTo(10.5, 2.2); p.lineTo(-9.8, 2.2); p.closePath(); });
