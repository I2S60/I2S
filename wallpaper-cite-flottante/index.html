let clouds = [];
function buildClouds() {
  const r = rng(555);
  clouds = Array.from({ length: 22 }, () => {
    const n = 5 + (r() * 3 | 0), sc = U * 0.0012 * (0.7 + r() * 1.1);
    const blobs = Array.from({ length: n }, (_, k) => ({
      dx: (k - (n - 1) / 2) * 34 + (r() - 0.5) * 10,
      dy: -Math.sin(k / (n - 1) * Math.PI) * 16 * r(),
      r: 38 + r() * 28 - Math.abs(k - (n - 1) / 2) * 4
    }));
    return { x: (r() * 1.4 - 0.2) * W, y: (0.05 + r() * 0.33) * H, sc, ext: n * 40 * sc,
             v: 4 + r() * 8, th: r() * 0.9, blobs };
  });
}
// Opacité des nuages au point (x, y) : sert à savoir si le soleil ou la lune est vraiment caché
function coverAt(x, y) {
  let cover = 0;
  for (const c of clouds) {
    const a = clamp((wth.cloud - c.th) * 3, 0, 1) * 0.9;
    if (a <= 0.01 || Math.abs(x - c.x) > c.ext || Math.abs(y - c.y) > c.ext) continue;
    for (const b of c.blobs) {
      const dx = (x - (c.x + b.dx * c.sc)) / (b.r * c.sc * 0.95);
      const dy = (y - (c.y + b.dy * c.sc)) / (b.r * c.sc * 0.6);
      const d = dx * dx + dy * dy;
      if (d < 1) cover = Math.max(cover, a * (1 - d));
    }
  }
  return Math.min(1, cover * 1.6);
}
function drawClouds(sky) {
  if (wth.cloud < 0.03) return;
  const dayK = 1 - sky.star;
  let lit = mix(mix(sky.hor, sky.glow, 0.25), [255, 255, 255], 0.5 * dayK);
  lit = mix(lit, [58, 62, 76], clamp(wth.storm * 0.55 + wth.rain * 0.25, 0, 0.7));
  tintSprite(cloudShadeC, mix(lit, sky.sil, 0.5));
  tintSprite(cloudLitC, lit);
  for (const c of clouds) {
    const a = clamp((wth.cloud - c.th) * 3, 0, 1) * 0.9;
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    for (const b of c.blobs) {
      const s = b.r * 2 * c.sc;
      ctx.drawImage(cloudShadeC, c.x + b.dx * c.sc - s / 2, c.y + (b.dy + b.r * 0.25) * c.sc - s * 0.31, s, s * 0.62);
    }
    for (const b of c.blobs) {

      ctx.drawImage(cloudLitC, c.x + b.dx * c.sc - s / 2, c.y + (b.dy - b.r * 0.08) * c.sc - s * 0.31, s, s * 0.62);

}

let bolt = null, flash = 0, nextBolt = 4;
const crR = rng((Date.now() ^ 0x5bd1e995) >>> 0);      // graine liée à l'heure de lancement : formations différentes à chaque fois
const boltFlash = a => a < 0.07 ? 1 : a < 0.13 ? 0.2 : a < 0.22 ? 0.95 : Math.exp(-(a - 0.22) * 5);

function spawnBolt() {
  const k = H / 1080, bx = (0.1 + crR() * 0.8) * W, end = HZ - H * 0.02;
  const pts = [[bx, H * 0.05]];
  let x = bx, y = H * 0.05;
  while (y < end) { y = Math.min(end, y + (10 + crR() * 22) * k); x += (crR() - 0.5) * 40 * k; pts.push([x, y]); }
  const br = [];
  for (let n = 0; n < 3; n++) {                        // branches secondaires
    const s = pts[(2 + crR() * (pts.length - 4)) | 0], b = [s], dx = (crR() - 0.5) * 2;
    let bx2 = s[0], by2 = s[1];
    for (let j = 0; j < 5; j++) { by2 += (10 + crR() * 16) * k; bx2 += dx * 14 + (crR() - 0.5) * 14; b.push([bx2, by2]); }
    br.push(b);
  }
  bolt = { pts, br, t0: T };
}
function drawLightning() {
  if (!bolt || flash < 0.03) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(190,205,255,${(flash * 0.3).toFixed(3)})`;
  ctx.fillRect(0, 0, W, HZ + 2);
  if (T - bolt.t0 < 0.45) {
    ctx.lineJoin = 'round';
    for (const [w, a] of [[10, 0.12], [4, 0.35], [1.6, 1]]) {
      ctx.lineWidth = w; ctx.strokeStyle = `rgba(215,225,255,${(a * flash).toFixed(3)})`;
      ctx.beginPath();
      bolt.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      for (const b of bolt.br) b.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

const RAIN_N = 800, SNOW_N = 500;
let rain = [], snow = [], ripples = [], rippleAcc = 0;
function buildPrecip() {
  const r = rng(909);
  rain = Array.from({ length: RAIN_N }, () => ({ x: r() * W, y: r() * H, v: 0.7 + r() * 0.6, l: r() }));
  snow = Array.from({ length: SNOW_N }, () => ({ x: r() * W, y: r() * H, v: 0.5 + r() * 0.8, ph: r() * 6.28, s: 1.5 + r() * 2 }));
  ripples = [];
}
function updatePrecip(dt) {
  const k = H / 1080;
  if (wth.rain > 0.02) {
    const n = Math.floor(RAIN_N * wth.rain), slant = 0.1 + windK * 0.4, sp = H * 1.1;
    for (let i = 0; i < n; i++) {
      const d = rain[i];
      d.y += d.v * sp * dt; d.x += d.v * sp * dt * slant;
      if (d.y > H) { d.y -= H + 40; d.x = crR() * W; }
      if (d.x > W) d.x -= W;
    }
    rippleAcc += dt * 45 * wth.rain;                   // gouttes qui frappent le lac
    while (rippleAcc >= 1 && ripples.length < 60) {
      rippleAcc -= 1;
      const u = Math.pow(crR(), 0.8);
      ripples.push({ x: crR() * W, y: HZ + 8 + u * (H - HZ - 8), u, age: 0, life: 0.6 + crR() * 0.5 });
    }
    rippleAcc = Math.min(rippleAcc, 2);
  }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].age += dt; if (ripples[i].age > ripples[i].life) ripples.splice(i, 1); }
  if (wth.snow > 0.02) {
    const n = Math.floor(SNOW_N * wth.snow);
    for (let i = 0; i < n; i++) {
      const f = snow[i];
      f.y += f.v * 55 * k * dt;
      f.x += (Math.sin(T * 0.8 + f.ph) * 18 + windK * 110) * k * dt;
      if (f.y > H) { f.y -= H + 10; f.x = crR() * W; }
      if (f.x > W) f.x -= W; else if (f.x < 0) f.x += W;
    }
  }
}
function drawPrecip(sky) {
  const k = H / 1080;
  if (wth.rain > 0.02) {
    const n = Math.floor(RAIN_N * wth.rain), slant = 0.1 + windK * 0.4;
    const light = mix(sky.hor, [215, 225, 240], 0.7);
    ctx.strokeStyle = rgb(light, 0.32); ctx.lineWidth = Math.max(1, 1.3 * k);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {                      // toutes les gouttes en un seul tracé
      const d = rain[i], l = (14 + d.l * 26) * k;
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - slant * l, d.y - l);
    }
    ctx.stroke();
    ctx.lineWidth = 1;
    for (const r of ripples) {                         // anneaux sur l'eau
      const p = r.age / r.life, rx = (3 + r.u * 16) * p * k * 2;
      ctx.strokeStyle = rgb(light, (1 - p) * 0.4);
      ctx.beginPath(); ctx.ellipse(r.x, r.y, rx, rx * 0.3, 0, 0, 6.2832); ctx.stroke();
    }
  }
  if (wth.snow > 0.02) {
    const n = Math.floor(SNOW_N * wth.snow);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < n; i++) { const f = snow[i], s = f.s * k; ctx.fillRect(f.x, f.y, s, s); }
  }
}

function boatShape(b, hull, sail) {
  const billow = 1 + 0.035 * Math.sin(T * 1.3 + b.ph);              // les voiles gonflent légèrement

      ctx.beginPath(); ctx.arc(x0 + Math.sin(u * 6 + i) * 0.8 + windK * u * 6, y0 - u * 9, 0.8 + u * 2, 0, 6.2832); ctx.fill();
    }

    case 0:

      ctx.fillStyle = rgb(sail); ctx.save(); ctx.scale(billow, 1); ctx.fill(SAIL); ctx.fill(JIB); ctx.restore();
      break;
    case 1:
      ctx.fill(HULL); ctx.fill(CABIN); ctx.fill(MAST2);
      ctx.fillStyle = rgb(sail); ctx.save(); ctx.scale(billow, 1); ctx.fill(LATEEN); ctx.restore();
      ctx.strokeStyle = rgb(hull); ctx.lineWidth = 0.6; ctx.stroke(YARD);
      break;
    case 2:
      ctx.fill(HULL_G); ctx.fill(G_MASTS);
      ctx.fillStyle = rgb(sail); ctx.save(); ctx.scale(billow, 1); ctx.fill(G_SAILS); ctx.restore();
      break;
    case 3: {
      ctx.fill(HULL_R); ctx.fill(ROWER);
      ctx.strokeStyle = rgb(hull); ctx.lineWidth = 0.5;               // rames qui battent
      const a = 0.9 + 0.35 * Math.sin(T * 2.2 + b.ph);
      ctx.beginPath();
      ctx.moveTo(-0.6, -2.6); ctx.lineTo(-0.6 + 5 * Math.cos(a), -2.6 + 5 * Math.sin(a));
      ctx.moveTo(0.4, -2.6); ctx.lineTo(0.4 + 5 * Math.cos(a + 0.28), -2.6 + 5 * Math.sin(a + 0.28));
      ctx.stroke();
      break; }
    case 4: {
      ctx.fill(HULL_Q); ctx.fill(FELZE); ctx.fill(GONDOLIER);
      ctx.strokeStyle = rgb(hull); ctx.lineWidth = 0.45;              // perche du gondolier
      ctx.beginPath(); ctx.moveTo(-8.6, -7.8); ctx.lineTo(-5.6 + 0.8 * Math.sin(T * 1.1 + b.ph), 2.8); ctx.stroke();
      break; }
    case 5:
      ctx.fill(HULL_B);
      ctx.fillStyle = rgb(mix(hull, sail, 0.45)); ctx.fill(CARGO);        // cargaison plus claire que la coque
      puff(9.7, -10.6, 4);
      break;
    case 6: {                                                         // bateau à aubes
      ctx.fill(HULL_P);
      ctx.fillStyle = rgb(mix(hull, sail, 0.5)); ctx.fill(P_CABIN);       // superstructure claire
      ctx.fillStyle = rgb(hull);
      ctx.save(); ctx.translate(-13.4, -0.6); ctx.rotate(T * 2.2);   // roue à aubes
      for (let i = 0; i < 8; i++) { ctx.fillRect(2.3, -0.5, 1.7, 1); ctx.rotate(Math.PI / 4); }
      ctx.strokeStyle = rgb(hull); ctx.lineWidth = 0.35; ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, 6.2832); ctx.stroke();
      ctx.restore();

      break; }
    case 7: {                                                         // drakkar
      ctx.fill(HULL_L); ctx.fill(DRAKE); ctx.fill(L_MAST);
      ctx.fillStyle = rgb(sail); ctx.save(); ctx.scale(billow, 1); ctx.fill(L_SAIL); ctx.restore();
      ctx.fillStyle = rgb(mix(hull, b.hullCol.map(v => v * 0.9), 0.5));                                       // bandes de la voile
      for (let i = 0; i < 4; i++) ctx.fillRect(-5 + i * 2.5 + 0.6, -15, 1.2, 8.2);
      for (let i = 0; i < 7; i++) { ctx.fillStyle = rgb(i % 2 ? sail : hull); ctx.beginPath(); ctx.arc(-8 + i * 2.6, -2.9, 0.95, 0, 6.2832); ctx.fill(); }   // boucliers
      ctx.strokeStyle = rgb(hull); ctx.lineWidth = 0.4; ctx.beginPath();                                       // rames
      for (let i = 0; i < 6; i++) { const x = -7 + i * 2.7, a = 1.7 + 0.25 * Math.sin(T * 2.1 + i * 0.4 + b.ph); ctx.moveTo(x, -2.2); ctx.lineTo(x + 4.2 * Math.cos(a), -2.2 + 4.2 * Math.sin(a)); }

      break; }
    case 9: {                                                         // canoë
      ctx.fill(HULL_C); ctx.fill(PADDLER);
      const ph = Math.sin(T * 2.4 + b.ph);                            // la pagaie alterne de chaque côté
      ctx.strokeStyle = rgb(hull); ctx.lineWidth = 0.4;

}
function boatLamps(b, a) {

function drawBoats(sky) {

  const sail = mix(mix(sky.sil, sky.hor, 0.55), sky.glow, 0.3);
  const foam = mix(sky.hor, [255, 255, 255], 0.45), dk = clamp(1 - sky.star, 0, 1);

/* --------------------------------------------------------------------------
   Monstre marin : un serpent de lac sort rarement de l'eau, nage, frappe l'eau de sa queue puis replonge
   -------------------------------------------------------------------------- */
let monster = { active: false, wait: QS.has('monster') ? 0.2 : 75 };   // rare : toutes les 2 à 5 minutes environ
const MONSTER_ACTS = ['tailslap', 'lunge'];                            // comportements : claque de queue et bond du cou
// Chaque apparition dure 24 à 32 s : il émerge, nage en travers du lac, fait une claque de queue et un bond du cou
// puis plonge en arche (aucun effet particulier au niveau de la tête)
function spawnMonster() {
  const f = 0.3 + crR() * 0.5, dir = crR() < 0.5 ? -1 : 1, travel = W * (0.12 + crR() * 0.12);
  const acts = MONSTER_ACTS.slice().sort(() => crR() - 0.5).slice(0, 3);
  monster = { active: true, t0: T, dur: 24 + crR() * 8, dir, travel,
              x: clamp((0.2 + crR() * 0.6) * W, W * 0.15 + (dir < 0 ? travel : 0), W * 0.85 - (dir > 0 ? travel : 0)),
              y: HZ + (H - HZ) * (0.18 + f * 0.62), sc: U * (0.0014 + 0.0017 * f), ph: crR() * 6.28, wait: 0,
              events: acts.map((kind, i) => ({ kind, u0: 0.28 + i * 0.3 + crR() * 0.04, du: 0.075 })) };
}
function updateMonster(dt) {
  if (monster.active) { if (T - monster.t0 > monster.dur) { monster.active = false; monster.wait = 140 + crR() * 160; } }
  else if ((monster.wait -= dt) <= 0) spawnMonster();
}
function drawMonster(sky) {
  const m = monster;
  if (!m.active) return;
  const u = (T - m.t0) / m.dur;
  const up = smooth(clamp(u / 0.1, 0, 1)), dive = smooth(clamp((u - 0.88) / 0.12, 0, 1));   // sortie de l'eau, puis plongeon
  if (up < 0.01 || u > 1) return;
  // intensité de chaque comportement (0 à 1) et avancement de l'éclaboussure après la claque de queue
  const ev = { tailslap: 0, lunge: 0 };
  let splash = -1;
  for (const e of m.events) {
    ev[e.kind] = Math.sin(Math.PI * clamp((u - e.u0) / e.du, 0, 1));
    if (e.kind === 'tailslap') { const ps = (u - (e.u0 + e.du * 0.5)) / 0.1; if (ps > 0 && ps < 1) splash = ps; }
  }
  const sc = m.sc, dir = m.dir, wy = m.y, env = up * (1 - dive * 0.1);
  const xc = m.x + dir * m.travel * smooth(clamp(u, 0, 1));                      // il nage lentement en travers du lac
  const dayK = clamp(1 - sky.star, 0, 1);
  const col = mix(mix(sky.sil, [30, 72, 82], 0.3), sky.hor, 0.08 * dayK);
  const sway = Math.sin(T * 0.9 + m.ph) * sc * 2 * (1 - ev.lunge);
  // cou : se dresse, se jette en avant (bond) ou plonge vers l'avant (fin)
  const Hn = (24 * sc * up - ev.lunge * 7 * sc) * (1 - 0.93 * dive);
  const hx = xc + dir * (9 * (0.5 + 0.5 * up) + 17 * ev.lunge + 20 * dive) * sc + sway, hy = wy - Hn;
  const cx = xc - dir * (6 - 4 * ev.lunge) * sc, cy = wy - Hn * 0.7;
  const nb = t => [(1 - t) * (1 - t) * xc + 2 * (1 - t) * t * cx + t * t * hx, (1 - t) * (1 - t) * wy + 2 * (1 - t) * t * cy + t * t * hy];
  const headRot = 0.2 + 0.07 * Math.sin(T * 0.8 + m.ph) + dive * 0.85 + ev.lunge * 0.25;   // tête renversée quand il rugit
  // queue : se redresse et frappe l'eau
  const tb = [xc - dir * 28 * sc, wy], tc = [xc - dir * 34 * sc, wy - 8 * sc * (up + ev.tailslap * 2)];
  const tt = [xc - dir * 38 * sc, wy - (6 * up + 24 * ev.tailslap) * sc];
  const tpt = t => [(1 - t) * (1 - t) * tb[0] + 2 * (1 - t) * t * tc[0] + t * t * tt[0], (1 - t) * (1 - t) * tb[1] + 2 * (1 - t) * t * tc[1] + t * t * tt[1]];

  const body = () => {
    ctx.fillStyle = rgb(col); ctx.strokeStyle = rgb(col); ctx.lineCap = 'round';
    for (let i = 0; i < 16; i++) {                                    // cou effilé
      const a = nb(i / 16), b = nb((i + 1) / 16);
      ctx.lineWidth = sc * (5.4 - 3.1 * i / 16);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    for (let i = 0; i < 8; i++) {                                     // queue effilée
      const a = tpt(i / 8), b = tpt((i + 1) / 8);
      ctx.lineWidth = sc * (3.4 - 2.5 * i / 8);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(tt[0], tt[1]); ctx.lineTo(tt[0] - dir * sc * 3, tt[1] - sc * 2.6); ctx.lineTo(tt[0] + dir * sc * 2.4, tt[1] - sc * 3.2); ctx.fill();   // nageoire
    for (let i = 3; i <= 14; i += 2) {                                // épines le long de la nuque
      const a1 = nb(i / 16), b1 = nb((i + 1.2) / 16);
      ctx.beginPath(); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(b1[0], b1[1]); ctx.lineTo(a1[0] - dir * sc * 2.2, a1[1] - sc * 1.3); ctx.fill();
    }
    ctx.save();                                                       // tête : crâne, museau, mâchoire, cornes, collerette
    ctx.translate(hx, hy); ctx.scale(dir, 1); ctx.rotate(headRot);
    ctx.beginPath(); ctx.ellipse(sc * 0.4, 0, sc * 3.1, sc * 1.7, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sc * 3.5, sc * 0.35, sc * 2.4, sc * 1.0, 0.08, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-sc * 1.0, -sc * 1.4); ctx.lineTo(-sc * 3.6, -sc * 3.4); ctx.lineTo(-sc * 0.1, -sc * 1.7); ctx.fill();
    ctx.restore();
    for (let k = 0; k < 3; k++) {                                     // bosses du dos qui ondulent, elles se cambrent au plongeon
      const hh = sc * (5.6 - k * 1.2) * up * (1 + 0.5 * Math.sin(Math.PI * dive)) * (1 - dive * 0.85) * (0.55 + 0.45 * Math.sin(T * 1.6 - k * 1.3 + m.ph));
      ctx.beginPath(); ctx.ellipse(xc - dir * (k * 9 + 9) * sc, wy, sc * 3.8, hh, 0, Math.PI, Math.PI * 2); ctx.fill();
    }
  };
  ctx.save();                                                         // au-dessus de l'eau seulement
  ctx.beginPath(); ctx.rect(0, 0, W, wy + sc * 0.8); ctx.clip();
  body();
  ctx.restore();
  ctx.save();                                                         // reflet
  ctx.beginPath(); ctx.rect(0, wy, W, H - wy); ctx.clip();
  ctx.translate(0, 2 * wy); ctx.scale(1, -1); ctx.globalAlpha = 0.28;
  body();
  ctx.restore();

  const foam = mix(sky.hor, [255, 255, 255], 0.5);
  // Sillage : deux traînées d'écume derrière le corps pendant qu'il nage + anneaux autour du point d'immersion
  const g = ctx.createLinearGradient(xc, 0, xc - dir * 60 * sc, 0);
  g.addColorStop(0, rgb(foam, 0.45 * up)); g.addColorStop(1, rgb(foam, 0));
  ctx.strokeStyle = g; ctx.lineWidth = Math.max(1, sc * 0.55);
  ctx.beginPath();
  ctx.moveTo(xc, wy + sc * 0.6); ctx.lineTo(xc - dir * 60 * sc, wy + sc * 0.6 - 7 * sc);
  ctx.moveTo(xc, wy + sc * 0.6); ctx.lineTo(xc - dir * 60 * sc, wy + sc * 0.6 + 7 * sc);
  ctx.stroke();
  ctx.lineWidth = Math.max(1, sc * 0.5);
  for (let i = 0; i < 3; i++) {
    const p = (T * 0.45 + i / 3) % 1;
    ctx.strokeStyle = rgb(foam, (1 - p) * 0.5 * up);
    ctx.beginPath(); ctx.ellipse(xc, wy + sc * 0.6, sc * (6 + p * 16), sc * (1.5 + p * 3.6), 0, 0, 6.2832); ctx.stroke();
  }
  const drops = (n, ox, oy, power, strength, spread) => {             // gouttes lancées depuis (ox, oy) qui retombent
    ctx.fillStyle = rgb(foam, 0.8);
    for (let k = 0; k < n; k++) {
      const t2 = (T * 1.3 + k * 0.29) % 1.3, vx = ((k % 7) - 3) * sc * spread;
      const px = ox + vx * t2, py = oy + (-sc * (power + (k % 3) * 3)) * t2 + 0.5 * sc * 30 * t2 * t2;
      if (py > wy) continue;
      ctx.globalAlpha = clamp((1 - t2 / 1.3) * strength, 0, 1);
      ctx.beginPath(); ctx.arc(px, py, sc * 0.5, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
  drops(16, xc, wy, 9, Math.max(1 - up, dive) * 0.9, 2.6);                                  // émergence et plongeon
  if (splash >= 0) {                                                                         // claque de queue : grosse éclaboussure
    ctx.lineWidth = Math.max(1, sc * 0.6);
    ctx.strokeStyle = rgb(foam, (1 - splash) * 0.7);
    ctx.beginPath(); ctx.ellipse(tt[0], wy + sc * 0.4, sc * (4 + splash * 20), sc * (1 + splash * 5), 0, 0, 6.2832); ctx.stroke();
    drops(22, tt[0], wy, 14, (1 - splash) * 1.1, 3.4);
  }
}

/* ==========================================================================
   8d. CRÉATURES : oiseaux, dragon lointain, créatures lumineuses
   ========================================================================== */
let flocks = [], dragon = null, jellies = [];
const mkGlow = (r, g, b) => {
  const c = mkCanvas(64), x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(0.3, `rgba(${r},${g},${b},0.4)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c;
};
const JELLY_COLORS = [[120, 230, 255], [190, 140, 255], [140, 255, 190]];
const JELLY_GLOWS = JELLY_COLORS.map(c => mkGlow(...c));
const GLOW_MIST = mkGlow(228, 240, 255);   // embruns des cascades
// Tache d'ombre douce (ellipse qui s'estompe vers les bords), étirée à volonté pour les ombres portées
const SHADOW = (() => {
  const c = mkCanvas(64), x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(4,14,44,1)'); g.addColorStop(0.55, 'rgba(4,14,44,0.55)'); g.addColorStop(1, 'rgba(4,14,44,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return c;
})();
const GLOW_FIRE = mkGlow(255, 140, 40), GLOW_FIRE2 = mkGlow(255, 228, 150);   // lueurs chaudes (montgolfières, yeux, forges)
const FLAME_RED = mkGlow(226, 46, 22), FLAME_ORANGE = mkGlow(255, 112, 26), FLAME_CORE = mkGlow(255, 168, 52);   // flamme du dragon : rouge-orangé

// Positions des oiseaux (décalage derrière le meneur) pour un type de formation
const FORMATIONS = ['v', 'line', 'row', 'ring', 'cluster', 'swarm'];
function flockSlots(kind, n, w) {
  return Array.from({ length: n }, (_, i) => {
    const k = Math.ceil(i / 2), side = i % 2 ? 1 : -1;                 // k = rang derrière le meneur
    let ox, oy;
    switch (kind) {
      case 'v':    ox = k * w * 2.3; oy = side * k * w * 1.25; break;           // en V
      case 'line': ox = k * w * 2.3; oy = k * w * 1.25; break;                  // en échelon (une diagonale)
      case 'row':  ox = (i - n / 2) * w * 2.6; oy = Math.sin(i * 0.9) * w * 0.8; break;   // file ondulante
      case 'ring': { const a = i / n * 6.283; ox = Math.cos(a) * w * n * 0.5; oy = Math.sin(a) * w * n * 0.3; break; } // ronde
      case 'cluster': ox = (crR() - 0.5) * w * 10; oy = (crR() - 0.5) * w * 6; break;     // groupe serré
      default:     ox = (crR() - 0.5) * w * 16; oy = (crR() - 0.5) * w * 8;               // nuée étalée
    }
    return { ox: ox + (crR() - 0.5) * w * 0.5, oy: oy + (crR() - 0.5) * w * 0.4 };
  });
}
// Chaque volée part d'une formation et se transforme lentement vers une autre (mélange A -> B),
// avec sa propre taille, vitesse, altitude et nombre d'oiseaux : elles ne se ressemblent jamais
// Trajectoires des oiseaux : ligne droite, ondulation, piqué, zigzag, vol plané, ou ronde autour d'une île
const FLIGHT_PATHS = ['straight', 'wave', 'wave', 'soar'];                 // trajectoires douces : jamais de zigzag ni de piqué brusque
// Décalage vertical (px) de la trajectoire à l'instant t depuis le début du vol
function pathOffset(f, t) {
  const A = f.amp;
  switch (f.path) {
    case 'wave':   return A * Math.sin(t * f.freq + f.ph);
    case 'swoop':  return A * Math.pow(Math.sin(t * f.freq * 0.5 + f.ph), 3);                  // longues remontées, plongeons brefs
    case 'zigzag': return A * 0.64 * Math.asin(Math.sin(t * f.freq + f.ph));                   // virages en dents de scie
    case 'soar':   return A * 0.4 * Math.sin(t * f.freq * 0.4 + f.ph) + A * 0.15 * Math.sin(t * f.freq * 1.7);
    default:       return 0;
  }
}
function spawnFlock(f, onScreen) {
  const dir = crR() < 0.5 ? -1 : 1, solo = crR() < 0.2;                // 1 volée sur 5 : un ou deux grands planeurs
  f.dir = dir; f.w = U * (solo ? 0.0055 + crR() * 0.0025 : 0.002 + crR() * 0.0028);   // demi-envergure en pixels (petits oiseaux lointains)
  const n = solo ? 1 + (crR() * 2 | 0) : 5 + (crR() * 17 | 0);
  const kA = FORMATIONS[(crR() * FORMATIONS.length) | 0];
  let kB = FORMATIONS[(crR() * FORMATIONS.length) | 0];
  if (kB === kA) kB = FORMATIONS[(FORMATIONS.indexOf(kA) + 1 + ((crR() * 4) | 0)) % FORMATIONS.length];
  f.kind = solo ? 'solo' : kA + '→' + kB;
  f.mr = 0.04 + crR() * 0.08;                                          // vitesse de transformation (période 50 à 150 s)
  f.v = (22 + crR() * 50) * (U / 1920); f.y = (0.07 + crR() * 0.34) * H; f.ph = crR() * 6.28;
  // Style de battement : continu, par salves ou longs planés ; les rapaces solitaires planent surtout
  const style = crR();
  f.glideBias = solo ? 1.0 : style < 0.5 ? -0.2 : 0.4;
  f.flapScale = clamp(U * 0.0035 / f.w, 0.6, 1.4);                     // les gros oiseaux battent plus lentement
  // Trajectoire et variations de vitesse (rafales)
  f.path = solo && crR() < 0.6 ? 'soar' : FLIGHT_PATHS[(crR() * FLIGHT_PATHS.length) | 0];
  f.amp = H * (0.008 + crR() * 0.02); f.freq = 0.15 + crR() * 0.25;          // légère ondulation de l'altitude, lente
  f.vamp = 0.02 + crR() * 0.04; f.vfreq = 0.1 + crR() * 0.2;                // vitesse quasi constante
  f.rate = 6 + crR() * 1.5;                                                  // cadence de battement commune à toute la volée
  f.age = 0; f.pathT0 = 0; f.mirror = dir; f.mode = 'path'; f.theta = dir > 0 ? 0 : Math.PI; f.vx = dir * f.v; f.vy = 0; f.cy = f.y;
  const near = islands.filter(i => i.haze < 0.35);
  if (f.path === 'orbit' && near.length) {                             // ronde autour d'une île, puis départ
    const isl = near[(crR() * near.length) | 0], rx = U * (0.05 + crR() * 0.05);
    f.mode = 'orbit';
    f.orbit = { cx: isl.x + (crR() - 0.5) * isl.s * 50, cy: isl.y - H * (0.06 + crR() * 0.08), rx, ry: rx * (0.35 + crR() * 0.25),
                w: (0.35 + crR() * 0.35) * (crR() < 0.5 ? -1 : 1), a: crR() * 6.28, dur: 14 + crR() * 14 };
    f.x = f.orbit.cx + f.orbit.rx * Math.cos(f.orbit.a); f.cy = f.orbit.cy + f.orbit.ry * Math.sin(f.orbit.a);
  } else {
    if (f.path === 'orbit') f.path = 'wave';
    f.x = onScreen ? crR() * W : (dir > 0 ? -f.w * 20 : W + f.w * 20);
  }
  const A = flockSlots(solo ? 'cluster' : kA, n, f.w), B = flockSlots(solo ? 'cluster' : kB, n, f.w);
  f.birds = A.map((a, i) => ({                                         // chaque oiseau a sa taille, sa cadence et ses dérives
    ax: a.ox, ay: a.oy, bx: B[i].ox, by: B[i].oy,
    s: 0.75 + crR() * 0.5, ph: crR() * 6.28, rate: 5 + crR() * 3.5,
    jx: crR() * 6.28, jy: crR() * 6.28, glide: crR() * 6.28
  }));
  f.active = true;
}

// Manœuvres du dragon : piqué, ascension, slalom, vol stationnaire (il crache alors du feu) et demi-tour
const DRAGON_MANEUVERS = { dive: 5.5, climb: 5, weave: 8, hover: 4.5, uturn: 6 };
function spawnDragon() {
  const dir = crR() < 0.5 ? -1 : 1, sc = U * 0.0016, y0 = (0.14 + crR() * 0.2) * H;
  const plan = [];                                                     // plus de manœuvres brusques : vol de croisière régulier
  dragon = { active: true, dir, face: dir, sc, x: dir > 0 ? -sc * 90 : W + sc * 90, y0, cy: y0, vx: 0, vy: 0, tilt: 0,
             v: W / (45 + crR() * 25), ph: crR() * 6.28, wait: 0, age: 0, plan, rate: 1.7, amp: 1, fold: 0, wph: 0,
             fireAt: T + 3 + crR() * 4, fireT0: -99 };
  if (QS.has('dragon')) { dragon.x = W * (dir > 0 ? 0.25 : 0.75); dragon.fireAt = T + 1.2; }   // test : déjà à l'écran
}
function buildCreatures() {
  flocks = Array.from({ length: 4 }, () => { const f = { wait: 0 }; spawnFlock(f, true); return f; });
  dragon = { active: false, wait: QS.has('dragon') ? 0.2 : 10 };
  jellies = Array.from({ length: 7 }, () => ({
    x: crR() * W, y: (0.12 + crR() * 0.4) * H, s: U * (0.007 + crR() * 0.006),
    v: (4 + crR() * 6) * (crR() < 0.5 ? -1 : 1), ph: crR() * 6.28, c: (crR() * 3) | 0
  }));
}
function updateCreatures(dt) {
  for (const f of flocks) {
    if (!f.active) { f.wait -= dt; if (f.wait <= 0) spawnFlock(f, false); continue; }
    f.age += dt;
    if (f.mode === 'orbit') {                                          // ronde : ellipse autour de l'île, puis envol dans la direction courante
      const o = f.orbit;
      o.a += o.w * dt;
      const nx = o.cx + o.rx * Math.cos(o.a), ny = o.cy + o.ry * Math.sin(o.a);
      f.vx = (nx - f.x) / dt; f.vy = (ny - f.cy) / dt; f.x = nx; f.cy = ny;
      if (f.age > o.dur) { f.mode = 'path'; f.dir = f.vx >= 0 ? 1 : -1; f.mirror = f.dir; f.y = f.cy; f.pathT0 = f.age; f.path = 'wave'; }
    } else {
      const sp = f.v * (1 + f.vamp * Math.sin(f.age * f.vfreq + f.ph)) * (1 + windK * 0.5);          // accélère et ralentit par rafales
      f.x += f.dir * sp * dt;
      const ny = f.y + pathOffset(f, f.age - f.pathT0);
      f.vy = (ny - f.cy) / dt; f.vx = f.dir * sp; f.cy = ny;
    }
    let da = Math.atan2(f.vy, f.vx) - f.theta; da = Math.atan2(Math.sin(da), Math.cos(da));
    f.theta += da * (1 - Math.exp(-dt * 3));                           // cap de la volée (lissé)
    if (f.mode === 'path' && (f.x < -f.w * 25 || f.x > W + f.w * 25)) { f.active = false; f.wait = 5 + crR() * 15; }
  }
  const d = dragon;
  if (d.active) {
    d.age += dt;
    // Vol naturel : croisière à vitesse constante, altitude qui ondule lentement, battements d'ailes par séries puis plané
    const dy = Math.sin(d.age * 0.28 + d.ph) * H * 0.035 + Math.sin(d.age * 0.11 + d.ph * 2) * H * 0.015;
    const flapGate = smooth(clamp(0.5 + 1.3 * Math.sin(d.age * 0.55 + d.ph), 0, 1));       // 1 = bat des ailes, 0 = plane
    const k1 = 1 - Math.exp(-dt * 2);
    d.rate += (lerp(0.6, 2.3, flapGate) - d.rate) * k1; d.amp += (lerp(0.2, 1, flapGate) - d.amp) * k1; d.fold = 0;
    d.wph += dt * d.rate;                                              // phase de battement cumulée (la cadence varie sans à-coup)
    const vx = d.dir * d.v;
    d.x += vx * dt;
    const ny = d.y0 + dy;
    d.vy = (ny - d.cy) / Math.max(dt, 1e-3); d.cy = ny; d.vx = vx; d.face = d.dir;
    d.tilt += (clamp(Math.atan2(-d.vy, Math.abs(vx)), -0.25, 0.25) - d.tilt) * (1 - Math.exp(-dt * 2));   // légère inclinaison en montée / descente
    // Souffle de feu toutes les 14 à 24 s, seulement quand le dragon est bien à l'écran
    if (T >= d.fireAt && d.x > W * 0.08 && d.x < W * 0.92) { d.fireT0 = T; d.fireAt = T + 14 + crR() * 10; }
    if (d.age > 2 && (d.x < -d.sc * 100 || d.x > W + d.sc * 100)) { d.active = false; d.wait = 40 + crR() * 50; }
  } else if ((d.wait -= dt) <= 0) spawnDragon();
  for (const j of jellies) { j.x += j.v * dt; if (j.x > W + 80) j.x = -80; else if (j.x < -80) j.x = W + 80; }
}
function drawBirds(sky) {
  const a = 1 - sky.star * 0.85;
  if (a < 0.05) return;
  ctx.strokeStyle = rgb(mix(sky.sil, sky.top, 0.15), a);
  ctx.lineCap = 'round';
  for (const f of flocks) {
    if (!f.active) continue;
    ctx.globalAlpha = clamp(f.age / 1.5, 0, 1);                        // apparition en fondu (surtout pour les rondes)
    ctx.lineWidth = Math.max(1, f.w * 0.26);
    ctx.beginPath();
    const m = 0;                                                       // formation stable (les oiseaux gardent leur place)
    const flockGate = smooth(clamp(0.5 - f.glideBias * 0.5 + 1.2 * Math.sin(T * 0.3 + f.ph), 0, 1));   // toute la volée bat des ailes puis plane ensemble
    const ct = Math.cos(f.theta), st = Math.sin(f.theta);
    const pitch = Math.atan2(f.vy, Math.abs(f.vx)) * (f.vx >= 0 ? 1 : -1) * 0.7, cp = Math.cos(pitch), sp = Math.sin(pitch);   // tangage selon la pente
    for (const b of f.birds) {
      const w = f.w * b.s;
      // position dans le repère de la volée (derrière le meneur), tournée selon le cap
      const lx = -lerp(b.ax, b.bx, m) + Math.sin(T * 0.6 + b.jx) * w * 0.15, ly = lerp(b.ay, b.by, m) * f.mirror + Math.sin(T * 0.8 + b.jy) * w * 0.12;
      const bx = f.x + lx * ct - ly * st, by = f.cy + lx * st + ly * ct;
      // alterne battements d'ailes et vol plané, chacun à son rythme
      const fl = lerp(0.25, Math.sin(T * f.rate * f.flapScale + b.ph * 0.12 + (b.ax / f.w) * 0.15), flockGate);
      const P = (x, y) => [bx + x * cp - y * sp, by + x * sp + y * cp];
      let q = P(-w, -fl * w * 0.55); ctx.moveTo(q[0], q[1]);
      q = P(-w * 0.45, -fl * w * 0.85 - w * 0.3); const q2 = P(0, 0); ctx.quadraticCurveTo(q[0], q[1], q2[0], q2[1]);
      q = P(w * 0.45, -fl * w * 0.85 - w * 0.3); const q3 = P(w, -fl * w * 0.55); ctx.quadraticCurveTo(q[0], q[1], q3[0], q3[1]);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineCap = 'butt';
}
function drawDragon(sky) {
  const d = dragon;
  if (!d.active) return;
  const sc = d.sc, N = 15, seg = sc * 5.2;
  const col = mix(sky.sil, sky.top, 0.05), nightK = clamp(sky.star * 1.2, 0, 1);
  ctx.save();
  ctx.translate(d.x, d.cy); ctx.scale(d.face, 1); ctx.rotate(-d.tilt);          // repère du dragon : tête à l'origine, regarde vers +x
  const P = [];
  for (let i = 0; i < N; i++) P.push([-i * seg, Math.sin(T * 2.1 - i * 0.55) * sc * 3.2 * (0.4 + i / N)]);
  const root = P[3], up = 0.3 + 0.7 * d.amp * Math.sin(d.wph + d.ph) - d.fold * 0.9, reach = 1 - 0.3 * d.fold;   // battement ; ailes repliées en piqué
  const wing = (ox, oy, a) => {
    const rx = root[0] + ox, ry = root[1] + oy;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.moveTo(rx, ry);
    ctx.lineTo(rx - 3 * sc * reach, ry - 26 * sc * up * reach);
    ctx.lineTo(rx - 11 * sc * reach, ry - 10 * sc * up * reach - 2 * sc);
    ctx.lineTo(rx - 19 * sc * reach, ry - 19 * sc * up * reach);
    ctx.lineTo(rx - 25 * sc * reach, ry - 5 * sc * up * reach);
    ctx.lineTo(rx - 15 * sc * reach, ry + sc);
    ctx.closePath(); ctx.fill();
  };
  ctx.fillStyle = rgb(col); ctx.strokeStyle = rgb(col); ctx.lineCap = 'round';
  wing(-3 * sc, -sc, 0.55);                                                      // aile éloignée
  ctx.globalAlpha = 1;
  for (let i = 0; i < N - 1; i++) {                                              // corps effilé
    ctx.lineWidth = sc * (0.7 + 3.6 * Math.sin(Math.min(1, (i + 1) / 5) * Math.PI / 2) * (1 - i / N));
    ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[i + 1][0], P[i + 1][1]); ctx.stroke();
  }
  wing(0, 0, 0.95);                                                              // aile proche
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.ellipse(sc * 1.5, 0, sc * 2.6, sc * 1.6, 0, 0, 6.2832); ctx.fill();                   // tête, museau, cornes
  ctx.beginPath(); ctx.moveTo(sc * 3, -sc * 1.4); ctx.lineTo(sc * 6.5, sc * 0.3); ctx.lineTo(sc * 3, sc * 1.4); ctx.fill();
  ctx.lineWidth = Math.max(1, sc * 0.6);
  ctx.beginPath(); ctx.moveTo(sc * 1, -sc * 1.3); ctx.lineTo(-sc * 2.5, -sc * 3.6); ctx.stroke();
  ctx.lineCap = 'butt';
  glow(sc * 2.4, -sc * 0.5, sc * 7, nightK * 0.9);                               // œil incandescent la nuit

  // Souffle de feu : gerbe de flammes rouge-orangé qui jaillit de la gueule, monte vite puis s'éteint doucement
  const age = T - d.fireT0, DUR = 1.9;
  if (age >= 0 && age < DUR) {
    const env = Math.min(1, age / 0.25) * Math.min(1, (DUR - age) / 0.7);
    const len = sc * 78 * (0.35 + 0.65 * Math.min(1, age / 0.5));                // la flamme s'allonge
    const mx = sc * 6.8, my = sc * 0.5, ang = 0.2;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const nightF = sky.star > 0.4;                                                // la nuit : lumière additive ; le jour : couleurs franches
    ctx.globalCompositeOperation = nightF ? 'lighter' : 'source-over';
    const NF = 40;
    for (let i = 0; i < NF; i++) {
      const q = i / (NF - 1), dist = q * len;
      const jx = Math.sin(T * 23 + i * 7.3) * sc * (0.3 + q * 1.8);                // tremblement des flammes
      const jy = Math.cos(T * 19 + i * 5.1) * sc * (0.3 + q * 2) - q * q * sc * 5;   // elles montent en s'éloignant
      const size = sc * (4.5 + q * 15);
      ctx.globalAlpha = clamp(env * (1 - q * 0.8) * 0.85 * (0.75 + 0.25 * Math.sin(T * 31 + i)), 0, 1);
      ctx.drawImage(q < 0.42 ? FLAME_ORANGE : FLAME_RED, mx + dx * dist + jx - size / 2, my + dy * dist + jy - size / 2, size, size);
    }
    ctx.globalAlpha = env * 0.9;
    ctx.drawImage(FLAME_ORANGE, mx - sc * 5, my - sc * 5, sc * 10, sc * 10);       // cœur de la flamme à la gueule
    ctx.globalAlpha = env * 0.8;
    ctx.drawImage(FLAME_CORE, mx - sc * 2.2, my - sc * 2.2, sc * 4.4, sc * 4.4);
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 10; i++) {                                                // étincelles projetées
      const tt = (T * 2 + i * 0.37) % 1, dist = len * (0.3 + tt * 0.9);
      ctx.globalAlpha = (1 - tt) * env * 0.9;
      ctx.fillStyle = i % 2 ? '#ff6a1f' : '#ff9a3a';
      ctx.fillRect(mx + dx * dist + Math.sin(i * 12.9) * sc * 4, my + dy * dist + Math.cos(i * 7.7) * sc * 4 + tt * sc * 6, sc * 0.7, sc * 0.7);
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawJellies(sky) {
  const vis = clamp(sky.star * 1.1, 0, 1) * (1 - wth.rain * 0.7) * (1 - wth.fog * 0.5);
  if (vis < 0.03) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const j of jellies) {
    const col = JELLY_COLORS[j.c], pulse = 0.75 + 0.25 * Math.sin(T * 1.5 + j.ph);
    const y = j.y + Math.sin(T * 0.6 + j.ph) * j.s * 0.5, s = j.s;
    ctx.globalAlpha = 0.5 * vis * pulse;
    ctx.drawImage(JELLY_GLOWS[j.c], j.x - s * 2.5, y - s * 2.5, s * 5, s * 5);           // halo
    ctx.globalAlpha = vis;
    ctx.drawImage(JELLY_GLOWS[j.c], j.x - s * 0.8, y - s * 0.8, s * 1.6, s * 1.6);       // cœur
    ctx.fillStyle = rgb(col, 0.2 * vis * pulse);                                          // ombrelle
    ctx.beginPath(); ctx.ellipse(j.x, y, s, s * 0.7 * (0.9 + 0.1 * pulse), 0, Math.PI, 6.2832); ctx.fill();
    ctx.strokeStyle = rgb(col, 0.35 * vis); ctx.lineWidth = 1.2;                          // tentacules ondulants
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {
      const bx = j.x + (k - 1.5) * s * 0.5;
      ctx.moveTo(bx, y);
      for (let n = 1; n <= 6; n++) ctx.lineTo(bx + Math.sin(T * 1.3 + k + n * 0.7 + j.ph) * s * 0.28 * n / 6, y + n * s * 0.45);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* ==========================================================================
   8e. PARTICULES D'AMBIANCE : lucioles, poussière magique, pétales
       Les tableaux sont dimensionnés pour l'intensité maximale (2) ; à l'intensité 1
       on n'en affiche que la moitié.
   ========================================================================== */
const FLY_N = 90, DUST_N = 160, PETAL_N = 40, BUT_N = 40, LANT_N = 24;
const GLOW_FLY = mkGlow(200, 255, 120), GLOW_GOLD = mkGlow(255, 225, 150);
const BUTTER_COLORS = ['255,170,60', '250,248,240', '244,214,76', '150,190,255', '255,140,170'];
let flies = [], dust = [], petals = [], butter = [], lants = [];

function respawnPetal(p, init) {
  const i = p.isl, k = U / 1920;
  p.x = i.x + (crR() - 0.5) * i.s * 70;
  p.y = init ? i.y + crR() * (HZ - i.y) * 0.8 : i.y - crR() * i.s * 8;
  p.vy = (14 + crR() * 14) * k; p.ph = crR() * 6.28; p.rot = crR() * 6.28;
  p.sp = 1 + crR() * 2.5; p.sz = (2.4 + crR() * 1.8) * k * 1.4; p.age = init ? 5 : 0;
}
function buildParticles() {
  const r = rng(808), near = islands.filter(i => i.haze < 0.35), k = U / 1920;
  flies = Array.from({ length: FLY_N }, () => {
    let hx, hy;
    if (r() < 0.6) { const i = near[(r() * near.length) | 0]; hx = i.x + (r() - 0.5) * i.s * 90; hy = i.y + (r() - 0.8) * 30 * i.s; }
    else { hx = r() * W; hy = HZ - (0.02 + r() * 0.08) * H; }              // lisière du lac
    return { hx, hy, ax: (20 + r() * 50) * k, ay: (10 + r() * 30) * k, a: 0.3 + r() * 0.5, b: 0.3 + r() * 0.5,
             ph: r() * 6.28, bl: 0.6 + r() * 1.4, sz: (9 + r() * 9) * k * 1.4 };
  });
  dust = Array.from({ length: DUST_N }, () => {
    const i = islands[(r() * islands.length) | 0];
    return { hx: i.x + (r() - 0.5) * i.s * 100, hy: i.y + r() * i.depth * i.s * 0.6, range: (60 + r() * 120) * i.s,
             sp: 0.03 + r() * 0.05, ph: r(), amp: (6 + r() * 16) * k, sz: (5 + r() * 7) * k * 1.4, gold: r() < 0.6 };
  });
  const big = islands.filter(i => i.haze < 0.15);
  petals = Array.from({ length: PETAL_N }, () => { const p = { isl: big[(r() * big.length) | 0] }; respawnPetal(p, true); return p; });
  // Papillons : butinent autour des îles (arbres et prés) en journée
  butter = Array.from({ length: BUT_N }, () => {
    const i = near[(r() * near.length) | 0];
    return { hx: i.x + (r() - 0.5) * i.s * 90, hy: i.y + (r() - 0.9) * 22 * i.s, ax: (14 + r() * 40) * k, ay: (8 + r() * 22) * k,
             a: 0.5 + r() * 0.7, b: 0.6 + r() * 0.8, ph: r() * 6.28, sz: (2.6 + r() * 1.6) * k * 1.4, c: BUTTER_COLORS[(r() * BUTTER_COLORS.length) | 0] };
  });
  // Lanternes célestes : s'élèvent lentement des îles la nuit
  lants = Array.from({ length: LANT_N }, () => {
    const i = islands[(r() * islands.length) | 0];
    return { hx: i.x + (r() - 0.5) * i.s * 70, hy: i.y + i.depth * i.s * 0.2, sp: 0.014 + r() * 0.012, ph: r(), amp: (10 + r() * 26) * k, sz: (11 + r() * 7) * k * 1.4 };
  });
}
function updatePetals(dt) {
  const k = U / 1920, n = Math.floor(PETAL_N * clamp(cfg.particles / 2, 0, 1));
  for (let i = 0; i < n; i++) {
    const p = petals[i];
    p.age += dt; p.y += p.vy * dt; p.rot += p.sp * dt;
    p.x += (Math.sin(T * 1.1 + p.ph) * 16 + windK * 110) * k * dt;
    if (p.y > HZ + (H - HZ) * 0.35 || p.x > W + 20 || p.x < -20) respawnPetal(p, false);
  }
}
function drawParticles(sky) {
  const f = clamp(cfg.particles / 2, 0, 1);
  if (f < 0.02) return;
  const dayK = 1 - sky.star;
  const night = clamp(lampBase * (1 - wth.rain * 0.8 - wth.snow * 0.3 - wth.fog * 0.4), 0, 1);
  const calm = clamp(1 - wth.rain * 0.8 - wth.snow * 0.6, 0, 1);

  ctx.globalCompositeOperation = 'lighter';
  if (night > 0.03) {                                              // lucioles qui clignotent
    const n = Math.floor(FLY_N * f);
    for (let i = 0; i < n; i++) {
      const p = flies[i];
      const x = p.hx + Math.sin(T * p.a + p.ph) * p.ax + Math.sin(T * p.a * 2.3) * p.ax * 0.3;
      const y = p.hy + Math.cos(T * p.b + p.ph * 1.7) * p.ay;
      const s = Math.max(0, Math.sin(T * p.bl + p.ph * 3));
      ctx.globalAlpha = night * (0.15 + 0.85 * s * s);
      ctx.drawImage(GLOW_FLY, x - p.sz / 2, y - p.sz / 2, p.sz, p.sz);
    }
  }

  for (let i = 0; i < n; i++) {
    const p = dust[i], u = (T * p.sp + p.ph) % 1;
    const x = p.hx + Math.sin(T * 0.7 + p.ph * 20) * p.amp + windK * u * 60 * (U / 1920);
    const y = p.hy - u * p.range + p.range / 2;
    const vis = p.gold ? 0.3 + 0.5 * night : (0.1 + 0.9 * night);
    ctx.globalAlpha = Math.sin(Math.PI * u) * vis * calm * 0.8;
    ctx.drawImage(p.gold ? GLOW_GOLD : JELLY_GLOWS[0], x - p.sz / 2, y - p.sz / 2, p.sz, p.sz);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  if (night > 0.05) {                                              // lanternes célestes qui montent et dérivent
    const nl = Math.floor(LANT_N * f);
    for (let i = 0; i < nl; i++) {
      const p = lants[i], u = (T * p.sp + p.ph) % 1;
      const x = p.hx + Math.sin(u * 9 + p.ph * 20) * p.amp + windK * u * 220 * (U / 1920);
      const y = p.hy - u * H * 0.5;
      glow(x, y, p.sz * (0.9 + 0.1 * Math.sin(T * 5 + p.ph * 30)), Math.sin(Math.PI * u) * night * 0.9);
    }
  }

  const pv = dayK * calm;                                          // pétales : le jour seulement
  if (pv > 0.05) {
    const np = Math.floor(PETAL_N * f);
    ctx.fillStyle = rgb(mix([255, 175, 200], sky.hor, 0.25));
    for (let i = 0; i < np; i++) {
      const p = petals[i];
      const lake = 1 - clamp((p.y - HZ) / ((H - HZ) * 0.35), 0, 1);
      ctx.globalAlpha = Math.min(1, p.age * 0.8) * pv * lake * 0.9;
      if (ctx.globalAlpha < 0.02) continue;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.scale(1, 0.25 + 0.75 * Math.abs(Math.cos(p.rot * 1.7)));   // le pétale se retourne
      ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz * 0.55, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    // Papillons : trajectoire capricieuse, ailes qui battent vite
    const nb = Math.floor(BUT_N * f);
    for (let i = 0; i < nb; i++) {
      const p = butter[i];
      const x = p.hx + Math.sin(T * p.a + p.ph) * p.ax + Math.sin(T * p.a * 2.7 + p.ph) * p.ax * 0.3;
      const y = p.hy + Math.sin(T * p.b * 1.3 + p.ph * 2) * p.ay + Math.sin(T * 3.1 + p.ph) * p.sz * 0.4;
      const w = p.sz * (0.25 + 0.75 * Math.abs(Math.sin(T * 13 + p.ph * 5)));          // ouverture des ailes
      ctx.fillStyle = `rgba(${p.c},${(pv * 0.9).toFixed(2)})`;
      ctx.beginPath();
      ctx.ellipse(x - w * 0.5, y, w * 0.5, p.sz * 0.42, 0, 0, 6.2832);
      ctx.ellipse(x + w * 0.5, y, w * 0.5, p.sz * 0.42, 0, 0, 6.2832);
      ctx.fill();

}

/* ==========================================================================
   8f. RENDU « PEINT » : grain de toile + coups de pinceau, rayons de lumière
   ========================================================================== */
let paintPattern = null;
function buildPaint() {
  const S = 512, c = mkCanvas(S), x = c.getContext('2d'), r = rng(31);
  x.fillStyle = 'rgb(128,128,128)'; x.fillRect(0, 0, S, S);     // gris neutre pour le mode « soft-light »
  x.lineCap = 'round';
  for (let i = 0; i < 900; i++) {                               // coups de pinceau diagonaux
    const px = r() * S, py = r() * S, a = -0.5 + (r() - 0.5) * 0.5, l = 20 + r() * 70, v = (100 + r() * 60) | 0;
    x.strokeStyle = `rgba(${v},${v},${v},${(0.10 + r() * 0.12).toFixed(2)})`; x.lineWidth = 2 + r() * 5;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
  const id = x.getImageData(0, 0, S, S), d = id.data;           // fin grain de toile
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 46; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(id, 0, 0);
  paintPattern = ctx.createPattern(c, 'repeat');
}
function drawPaint() {
  if (cfg.painted < 0.01 || !paintPattern) return;
  ctx.globalCompositeOperation = 'soft-light';
  ctx.globalAlpha = Math.min(1, cfg.painted * 0.6);
  ctx.fillStyle = paintPattern;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
// Rayons de lumière divergents depuis le soleil ou la lune (un seul tracé, un seul dégradé)
function drawRays(x, y, k, col, reach) {
  k *= cfg.godRays;
  if (k < 0.01) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, reach);
  g.addColorStop(0, rgb(col, 0.22 * k)); g.addColorStop(1, rgb(col, 0));
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.beginPath();
  const n = 14;
  for (let i = 0; i < n; i++) {
    const a = Math.PI / 2 + (i / (n - 1) - 0.5) * Math.PI * 0.95 + Math.sin(T * 0.05 + i * 1.7) * 0.05;
    const hw = 0.016 + 0.012 * (0.5 + 0.5 * Math.sin(T * 0.2 + i * 2.3));       // largeur qui respire
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a - hw) * reach, y + Math.sin(a - hw) * reach);
    ctx.lineTo(x + Math.cos(a + hw) * reach, y + Math.sin(a + hw) * reach);
    ctx.closePath();
  }
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

/* ==========================================================================
   8j. BRUME DEVANT LES ÎLES : de longs voiles de brume dérivent lentement devant les îles (effet de perspective)
   ========================================================================== */
const mistC = mkCanvas(128);
let mists = [];
function buildMist() {
  const r = rng(1212);

}

/* ==========================================================================
   8i. OMBRES PORTÉES
   ========================================================================== */
// Ombres sur le lac : îles, nuages et montgolfières projettent une tache d'ombre douce à l'opposé de la lumière,
// plus décalée quand la source est basse. Elles suivent le mouvement des objets (flottement, dérive des nuages).
function drawLakeShadows() {
  if (shadeK < 0.03) return;
  const lh = H - HZ;
  const blob = (x, y, w, h, a) => { ctx.globalAlpha = clamp(a, 0, 1); ctx.drawImage(SHADOW, x - w / 2, y - h / 2, w, h); };
  for (const isl of islands) {
    const altF = clamp((HZ - isl.y) / (H * 0.5), 0.1, 1);                 // plus l'île est haute, plus son ombre est proche de nous
    const bob = Math.sin(T * isl.f + isl.ph) * isl.bobAmp * cfg.floatAmp;
    const sx = isl.x + (isl.x - shadeX) * (0.22 + 0.5 * altF), sy = HZ + lh * (0.1 + 0.62 * altF);
    const w = isl.s * 100 * (0.7 + 0.5 * (sy - HZ) / lh);
    blob(sx, sy + bob * 0.2, w, w * (0.1 + 0.05 * altF), shadeK * 0.3 * (1 - isl.haze * 0.7));
  }
  for (const c of clouds) {                                               // ombres des nuages qui défilent sur l'eau
    const cover = clamp((wth.cloud - c.th) * 3, 0, 1) * 0.9;
    if (cover < 0.15) continue;
    const sx = c.x + (c.x - shadeX) * 0.3, sy = HZ + lh * (0.08 + 0.75 * clamp(c.y / (H * 0.4), 0, 1));
    const w = c.ext * 2.4;
    blob(sx, sy, w, w * 0.11, shadeK * 0.16 * cover);
  }
  for (const b of balloons) {                                             // ombres des montgolfières
    const f = clamp((HZ - b.y0) / (H * 0.5), 0.1, 1), sx = b.x + (b.x - shadeX) * 0.3, sy = HZ + lh * (0.25 + 0.55 * f);
    blob(sx, sy, b.s * 24, b.s * 3.6, shadeK * 0.28 * (1 - b.haze));
  }
  ctx.globalAlpha = 1;
}
// Ombres sur une île (dans le repère local de l'île) : les bâtiments projettent une bande allongée à l'opposé de la lumière,
// les arbres une tache ovale. Découpées par le contour du rocher pour ne jamais dépasser dans le vide.
function drawIslandShadows(isl) {
  if (shadeK < 0.03 || isl.haze > 0.55) return;
  const dirX = clamp((isl.x - shadeX) / (W * 0.45), -1, 1), lean = dirX * 0.55 + (dirX >= 0 ? 0.12 : -0.12);
  ctx.save();
  ctx.clip(isl.body);
  ctx.fillStyle = `rgba(6,14,40,${(shadeK * 0.26 * (1 - isl.haze)).toFixed(3)})`;
  ctx.beginPath();
  for (const b of isl.bldgs) {
    const L = lean * Math.min(b.h, 26);
    ctx.moveTo(b.x - b.w / 2, b.y); ctx.lineTo(b.x + b.w / 2, b.y);
    ctx.lineTo(b.x + b.w / 2 + L, b.y + 1.5); ctx.lineTo(b.x - b.w / 2 + L, b.y + 1.5); ctx.closePath();
  }
  for (const t of isl.trees) {
    const r = 2.4 * t.sc, ox = t.x + lean * 5 * t.sc;
    ctx.moveTo(ox + r, t.y + 0.6); ctx.ellipse(ox, t.y + 0.6, r, 0.9, 0, 0, 6.2832);
  }
  ctx.fill();
  ctx.restore();
}

/* ==========================================================================
   8h. AURORES BORÉALES ET ARC-EN-CIEL
   ========================================================================== */
// Sprite d'un rayon d'aurore : dégradé vertical (lumineux en bas, qui s'efface vers le haut) à bords latéraux doux
function mkAuroraSprite(r, g, b) {
  const c = document.createElement('canvas'); c.width = 16; c.height = 128;
  const x = c.getContext('2d'), gv = x.createLinearGradient(0, 0, 0, 128);
  gv.addColorStop(0, `rgba(${r},${g},${b},0)`); gv.addColorStop(0.55, `rgba(${r},${g},${b},0.22)`);
  gv.addColorStop(0.9, `rgba(${r},${g},${b},0.85)`); gv.addColorStop(1, `rgba(${r},${g},${b},0.1)`);
  x.fillStyle = gv; x.fillRect(0, 0, 16, 128);
  x.globalCompositeOperation = 'destination-in';
  const gh = x.createLinearGradient(0, 0, 16, 0);
  gh.addColorStop(0, 'rgba(0,0,0,0)'); gh.addColorStop(0.3, 'rgba(0,0,0,1)'); gh.addColorStop(0.7, 'rgba(0,0,0,1)'); gh.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gh; x.fillRect(0, 0, 16, 128);
  return c;
}
const AURORA_SPR = [mkAuroraSprite(70, 255, 150), mkAuroraSprite(60, 225, 225), mkAuroraSprite(190, 110, 255)];
// Trois rideaux superposés : vert (le plus fort), turquoise, violet (en hauteur)
const AURORA_DEF = [
  { s: 0, base: 0.30, amp: 0.05, hmax: 0.22, ph: 0.0, sp: 0.05, a: 0.78 },
  { s: 1, base: 0.26, amp: 0.06, hmax: 0.20, ph: 2.1, sp: 0.04, a: 0.58 },
  { s: 2, base: 0.22, amp: 0.07, hmax: 0.17, ph: 4.2, sp: 0.06, a: 0.44 }
];
function drawAurora(sky, k) {
  if (k < 0.02) return;
  const strips = 96, sw = W / strips;
  ctx.globalCompositeOperation = 'lighter';
  for (const rb of AURORA_DEF) {
    const spr = AURORA_SPR[rb.s];
    for (let i = 0; i < strips; i++) {
      const x = i * sw, u = x / W;
      // ligne basse du rideau qui ondule, hauteur qui varie, et rayons verticaux qui scintillent
      const base = H * (rb.base + rb.amp * Math.sin(u * 5.2 + T * rb.sp + rb.ph) + rb.amp * 0.6 * Math.sin(u * 11 - T * rb.sp * 1.7));
      const hh = H * rb.hmax * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(u * 7 + T * 0.13 + rb.ph * 2))) * (0.75 + 0.25 * Math.sin(u * 63 + T * 1.7 + i));
      ctx.globalAlpha = clamp(k * rb.a * (0.55 + 0.45 * Math.sin(u * 9 + T * 0.3 + rb.ph)), 0, 1);
      ctx.drawImage(spr, 0, 0, 16, 128, x - sw * 0.3, base - hh, sw * 1.6, hh);
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// Arc-en-ciel : apparaît quand il pleut légèrement alors que le soleil brille, à l'opposé du soleil.
// Dégradé radial en anneau (rouge à l'extérieur, violet à l'intérieur) + arc secondaire plus pâle, inversé.
const RAINBOW_STOPS = [[0, [120, 60, 200, 0]], [0.08, [150, 80, 220, 0.5]], [0.2, [80, 90, 230, 0.55]], [0.32, [70, 150, 240, 0.6]],
                       [0.45, [90, 210, 130, 0.6]], [0.58, [250, 235, 100, 0.6]], [0.72, [255, 160, 70, 0.62]], [0.86, [240, 70, 70, 0.55]], [1, [240, 70, 70, 0]]];
function drawRainbow(sky, sunX, sunAlt, sunCover) {
  const k = smooth(clamp((wth.rain - 0.05) / 0.2, 0, 1)) * clamp(1 - (wth.rain - 0.55) / 0.3, 0, 1) *      // pluie fine à modérée
            (1 - smooth(clamp((wth.cloud - 0.3) / 0.35, 0, 1))) * (1 - sunCover) * (1 - wth.storm) *       // ciel assez dégagé, soleil visible
            clamp((sunAlt - 0.04) / 0.1, 0, 1) * (1 - smooth(clamp((sunAlt - 0.7) / 0.25, 0, 1)));          // soleil ni couché ni au zénith
  rbK += (k - rbK) * (1 - Math.exp(-frameDt * 0.8));                                                       // apparition en douceur
  if (rbK < 0.01) return;
  const cx = clamp(W - sunX, W * 0.2, W * 0.8), cy = HZ + H * 0.2, R = H * 0.62, bw = R * 0.012;
  const ring = (radius, rev, alpha) => {
    const r0 = radius - bw * 8, r1 = radius + bw * 0.8, g = ctx.createRadialGradient(cx, cy, r0, cx, cy, r1);
    const stops = rev ? RAINBOW_STOPS.map(([p, c]) => [1 - p, c]).reverse() : RAINBOW_STOPS;
    for (const [p, c] of stops) g.addColorStop(p, `rgba(${c[0]},${c[1]},${c[2]},${(c[3] * alpha).toFixed(3)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ);
  };
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, HZ); ctx.clip();                      // l'arc s'arrête à l'horizon
  ring(R, false, rbK * 0.8);
  ring(R * 1.28, true, rbK * 0.28);                                        // arc secondaire
  ctx.restore();
}

/* ==========================================================================
   8g. MONTGOLFIÈRES : dérivent avec le vent, brûleur qui s'allume, ballon éclairé la nuit
   ========================================================================== */
const BALLOON_COLORS = [
  [[214, 64, 58], [246, 236, 220], [240, 170, 50]],      // rouge, crème, orange
  [[52, 110, 190], [246, 240, 226], [230, 80, 80]],      // bleu, crème, rouge
  [[60, 150, 110], [250, 235, 190], [210, 90, 60]],      // vert, ivoire, brique
  [[140, 80, 170], [245, 200, 220], [250, 225, 120]],    // violet, rose, jaune
  [[230, 140, 40], [250, 226, 150], [190, 60, 50]]       // orange, jaune pâle, rouge sombre
];
let balloons = [];
// Demi-largeur de l'enveloppe selon la hauteur (t de 0 = sommet à 1 = goulot) : forme en goutte
const balloonHW = t => Math.max(2.6, 10.5 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.8)), 0.75));
// Enveloppe + fuseaux (bandes verticales de couleurs alternées) dessinés une fois
function makeBalloonShape(rn) {
  const N = 22, env = new Path2D(), k = rn() < 0.5 ? 2 : 3, n = 8 + 2 * ((rn() * 3) | 0);
  const gp = Array.from({ length: k }, () => new Path2D());
  const ptY = j => -13.5 + 27.5 * (j / N);
  for (let j = 0; j <= N; j++) env[j ? 'lineTo' : 'moveTo'](-balloonHW(j / N), ptY(j));
  for (let j = N; j >= 0; j--) env.lineTo(balloonHW(j / N), ptY(j));
  env.closePath();
  for (let i = 0; i < n; i++) {
    const a0 = -1 + 2 * i / n, a1 = -1 + 2 * (i + 1) / n, p = gp[i % k];
    for (let j = 0; j <= N; j++) p[j ? 'lineTo' : 'moveTo'](a0 * balloonHW(j / N), ptY(j));
    for (let j = N; j >= 0; j--) p.lineTo(a1 * balloonHW(j / N), ptY(j));
    p.closePath();
  }
  const band = new Path2D(); band.rect(-11, -1.5, 22, 3.4);
  return { env, gp, k, band, hasBand: rn() < 0.5 };
}
function respawnBalloon(b, first) {
  const near = crR();
  b.near = near; b.s = U * (0.0010 + 0.0016 * near); b.haze = 0.32 * (1 - near);   // petite montgolfière, loin dans le ciel
  b.y0 = (0.10 + crR() * 0.28) * H; b.v = (5 + crR() * 8) * (U / 1920) * (0.6 + near * 0.8);
  b.pal = BALLOON_COLORS[(crR() * BALLOON_COLORS.length) | 0]; b.shape = makeBalloonShape(crR);
  b.ph = crR() * 6.28; b.period = 7 + crR() * 6;
  if (!first) b.x = -30 * b.s;
}
function buildBalloons() {
  balloons = [0.08].map(fx => { const b = { x: fx * W }; respawnBalloon(b, true); return b; });
}
function updateBalloons(dt) {
  for (const b of balloons) {
    b.x += b.v * dt * (0.6 + windK * 2.2);                              // le vent les pousse vers la droite
    if (b.x > W + 30 * b.s) respawnBalloon(b, false);
  }
}
function drawBalloons(sky) {
  const vis = clamp(1 - wth.rain * 1.2 - wth.storm - wth.fog * 0.5, 0, 1);       // ils se posent par mauvais temps
  if (vis < 0.03) return;
  const night = lampBase, hor = sky.hor;
  for (const b of balloons) {
    const cyc = (T + b.ph * 3) % b.period, burst = cyc < 0.9 ? Math.sin(Math.PI * cyc / 0.9) : 0;   // coup de brûleur
    const y = b.y0 + Math.sin(T * 0.11 + b.ph) * H * 0.03 - burst * b.s * 1.2;
    const tilt = Math.sin(T * 0.5 + b.ph) * 0.035;                                // balancement du panier
    // couleurs : assombries la nuit, brumeuses au loin, réchauffées par l'éclairage intérieur
    const warm = night * (0.3 + 0.5 * burst);
    const tint = c => mix(mix(mix(c, [12, 16, 34], 0.55 * sky.star * (1 - warm)), [255, 196, 120], warm * 0.55), hor, b.haze);
    const dark = tint([70, 52, 40]);
    ctx.globalAlpha = vis;
    ctx.save();
    ctx.translate(b.x, y); ctx.rotate(tilt); ctx.scale(b.s, b.s);
    // cordages, panier et brûleur
    ctx.strokeStyle = rgb(dark); ctx.lineWidth = 0.25;
    ctx.beginPath(); ctx.moveTo(-2.6, 13.6); ctx.lineTo(-2.2, 19); ctx.moveTo(2.6, 13.6); ctx.lineTo(2.2, 19); ctx.moveTo(-0.9, 14); ctx.lineTo(-0.7, 19); ctx.moveTo(0.9, 14); ctx.lineTo(0.7, 19); ctx.stroke();
    ctx.fillStyle = rgb(dark); ctx.fillRect(-2.4, 19, 4.8, 3.4); ctx.fillRect(-2.7, 18.6, 5.4, 0.8); ctx.fillRect(-0.5, 15, 1, 1.2);
    // enveloppe : fond, fuseaux alternés, bande horizontale éventuelle
    const [c0, c1, c2] = b.pal.map(tint), sh = b.shape;
    ctx.fillStyle = rgb(c0); ctx.fill(sh.env);
    ctx.fillStyle = rgb(c1); ctx.fill(sh.gp[1]);
    if (sh.k === 3) { ctx.fillStyle = rgb(c2); ctx.fill(sh.gp[2]); }
    if (sh.hasBand) { ctx.save(); ctx.clip(sh.env); ctx.fillStyle = rgb(sh.k === 3 ? c0 : c2); ctx.fill(sh.band); ctx.restore(); }
    // ombrage doux d'un côté pour donner du volume
    const g = ctx.createLinearGradient(-10, 0, 10, 0);
    g.addColorStop(0, 'rgba(255,255,255,0.14)'); g.addColorStop(0.55, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,30,0.28)');
    ctx.fillStyle = g; ctx.fill(sh.env);
    // lueur du brûleur et éclairage de l'enveloppe la nuit
    ctx.globalCompositeOperation = 'lighter';
    const inner = night * 0.3 + burst * 0.22;
    if (inner > 0.02) { ctx.globalAlpha = vis * inner; ctx.drawImage(GLOW_FIRE, -14, -14, 28, 28); }
    ctx.globalAlpha = vis * (burst * 0.95 + night * 0.18);
    ctx.drawImage(GLOW_FIRE2, -3.5, 12.2, 7, 7);
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// Recrée tout ce qui dépend de la taille d'écran
function buildWorld() { buildClouds(); buildPrecip(); buildBoats(); buildCreatures(); buildParticles(); buildPaint(); buildBalloons(); buildMist();
  fogWisps = Array.from({ length: 9 }, (_, i) => ({ x: (i / 9) * (W + 800), y: HZ + (0.03 + 0.9 * ((i * 37) % 9) / 9) * (H - HZ), w: U * (0.45 + 0.35 * ((i * 53) % 7) / 7), v: 6 + (i % 4) * 3 })); }

// Met à jour la météo lissée et toutes les animations indépendantes du dessin
function updateWorld(dt) {
  const k = 1 - Math.exp(-dt * 0.5);                             // transition douce (quelques secondes)
  for (const key in wth) wth[key] += (wthT[key] - wth[key]) * k;
  windK = wth.wind * (0.75 + 0.25 * Math.sin(T * 0.6));
  swayPh += dt * (1.3 + windK * 1.2);
  bridgePh += dt * (0.7 + windK * 0.7);
  fogPh += dt * (0.5 + windK * 2);
  for (const c of clouds) { c.x += c.v * (0.4 + windK * 3) * dt; if (c.x > W + c.ext) c.x = -c.ext; }
  if (!bolt && wth.storm > 0.3 && T > nextBolt) { spawnBolt(); nextBolt = T + 3 + crR() * 8; }
  if (bolt) { const age = T - bolt.t0; flash = boltFlash(age); if (age > 1.4) { bolt = null; flash = 0; } }
  updatePrecip(dt); updateBoats(dt); updateCreatures(dt); updatePetals(dt); updateLife(dt); updateMonster(dt); updateBalloons(dt);
}

/* --------------------------------------------------------------------------
   Protection des modules facultatifs : si l'un plante (navigateur ancien...), il est
   désactivé, l'erreur s'affiche en bas à gauche et le reste du décor continue.
   -------------------------------------------------------------------------- */
drawClouds = safe('nuages', drawClouds);        drawLightning = safe('éclairs', drawLightning);
drawJellies = safe('créatures', drawJellies);   drawBirds = safe('oiseaux', drawBirds);
drawDragon = safe('dragon', drawDragon);        drawBoats = safe('barques', drawBoats);
drawParticles = safe('particules', drawParticles); drawRays = safe('rayons', drawRays);
drawFog = safe('brouillard', drawFog);          drawPrecip = safe('précipitations', drawPrecip);
drawPaint = safe('peinture', drawPaint);
updatePrecip = safe('maj précipitations', updatePrecip); updateBoats = safe('maj barques', updateBoats);
updateCreatures = safe('maj créatures', updateCreatures); updatePetals = safe('maj pétales', updatePetals);
buildClouds = safe('build nuages', buildClouds); buildPrecip = safe('build pluie', buildPrecip);
buildBoats = safe('build barques', buildBoats);  buildCreatures = safe('build créatures', buildCreatures);
buildParticles = safe('build particules', buildParticles); buildPaint = safe('build peinture', buildPaint);
buildStars = safe('build étoiles', buildStars);
drawIslandLife = safe('vie des îles', drawIslandLife); drawFalls = safe('cascades', drawFalls);
drawMist = safe('brume', drawMist); buildMist = safe('build brume', buildMist);
drawLakeShadows = safe('ombres du lac', drawLakeShadows); drawIslandShadows = safe('ombres des îles', drawIslandShadows);
drawAurora = safe('aurores', drawAurora); drawRainbow = safe('arc-en-ciel', drawRainbow);
drawBalloons = safe('montgolfières', drawBalloons); updateBalloons = safe('maj montgolfières', updateBalloons); buildBalloons = safe('build montgolfières', buildBalloons);
drawMonster = safe('monstre marin', drawMonster); updateMonster = safe('maj monstre', updateMonster);
drawVines = safe('lianes', drawVines); updateLife = safe('maj vie', updateLife);

/* --------------------------------------------------------------------------
   9. BOUCLE PRINCIPALE
   -------------------------------------------------------------------------- */
let last = 0, fpsAcc = 0, fpsCount = 0, fpsShown = 0, lampBase = 0, frameDt = 0, rayK = 0;
let dateKey = -1, dateText = '';                       // date affichée (recalculée une fois par jour)

function frame(ms) {
  requestAnimationFrame(frame);
  if (ms - last < 1000 / cfg.fpsLimit - 2) return;        // limite de FPS (économie GPU/CPU)
  const dt = Math.min((ms - last) / 1000, 0.1);
  last = ms; T += dt;

  try {
    updateHour(dt);
    updateWorld(dt);
    const sky = skyAt(hourShown);
    lampBase = clamp(sky.star / 0.6, 0, 1);              // éclairage décidé avant que la météo ne masque les étoiles
    applyWeather(sky);
    frameDt = dt;
    drawFrame(sky, hourShown);
  } catch (e) { reportError(e, 'image'); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }

  if (cfg.showClock && hourShown !== null) {            // heure et date, en haut à droite
    const hh = Math.floor(hourShown), mm = Math.floor((hourShown % 1) * 60);
    // La date suit le cycle accéléré (elle change quand on passe minuit) ; mise en cache par jour
    const day = new Date(Date.now() + (cfg.testMode ? 0 : extraHours * 3.6e6));
    const key = day.getFullYear() * 400 + day.getMonth() * 32 + day.getDate();
    if (key !== dateKey) {
      dateKey = key;
      try { dateText = day.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
      catch (e) { dateText = day.toDateString(); }
      dateText = dateText.charAt(0).toUpperCase() + dateText.slice(1);
    }
    const x = W - H * 0.04, y = H * 0.035, big = Math.round(H * 0.07);
    ctx.setTransform(cfg.renderScale, 0, 0, cfg.renderScale, 0, 0);
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = `300 ${big}px "Segoe UI", system-ui, sans-serif`;
    ctx.fillText(`${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`, x, y);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = `400 ${Math.round(big * 0.34)}px "Segoe UI", system-ui, sans-serif`;
    ctx.fillText(dateText, x, y + big * 1.05);
    ctx.shadowBlur = 0; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  if (cfg.debug) {
    fpsAcc += dt; fpsCount++;
    if (fpsAcc > 0.5) { fpsShown = Math.round(fpsCount / fpsAcc); fpsAcc = 0; fpsCount = 0; }
    const hh = Math.floor(hourShown), mm = Math.floor((hourShown % 1) * 60);
    ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
    ctx.fillText(`${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}  ${fpsShown} fps  ${wxInfo}`, 16, 28);
  }
}

/* --------------------------------------------------------------------------
   10. PROPRIÉTÉS WALLPAPER ENGINE (définies dans project.json)
   -------------------------------------------------------------------------- */
window.wallpaperPropertyListener = {
  applyUserProperties(p) {
    if (p.cyclespeed) cfg.cycleSpeed = Number(p.cyclespeed.value) || 1;
    if (p.testmode)   cfg.testMode   = !!p.testmode.value;
    if (p.testhour)   cfg.testHour   = Number(p.testhour.value);
    if (p.floatamp)   cfg.floatAmp   = Number(p.floatamp.value);
    if (p.moonphase)  cfg.moonPhase  = Number(p.moonphase.value);
    if (p.particles)  cfg.particles  = Number(p.particles.value);
    if (p.painted)    cfg.painted    = Number(p.painted.value);
    if (p.godrays)    cfg.godRays    = Number(p.godrays.value);
    if (p.showclock)  cfg.showClock  = !!p.showclock.value;
    if (p.aurora)     cfg.aurora     = Number(p.aurora.value);
    // Météo : tout changement relance une actualisation (avec un court délai anti-rafale)
    if (p.weatherenabled) { wx.on   = !!p.weatherenabled.value; scheduleRefresh(); }
    if (p.autolocation)   { wx.auto = !!p.autolocation.value;   scheduleRefresh(); }
    if (p.city)           { wx.city = String(p.city.value || ''); scheduleRefresh(); }
    if (p.testweather)    { wx.test = String(p.testweather.value); scheduleRefresh(); }
    if (p.renderscale) { cfg.renderScale = clamp(Number(p.renderscale.value), 0.5, 1); resize(); }
  },
  applyGeneralProperties(p) {
    if (p.fps) cfg.fpsLimit = p.fps;                       // réglage FPS global de Wallpaper Engine
  }
};

// Compatibilité Sucrose Wallpaper Engine : mêmes réglages, reçus via SucrosePropertyListener(nom, contrôle)
const WX_TESTS = ['auto', 'clear', 'cloudy', 'fog', 'rain', 'storm', 'snow', 'wind', 'sunshower'];   // même ordre que la liste déroulante
const BOOL_PROPS = ['testmode', 'weatherenabled', 'autolocation', 'showclock'];
window.SucrosePropertyListener = (name, val) => {
  if (!val) return;
  let v = val.value;
  if (name === 'testweather') v = WX_TESTS[Number(v) | 0] || 'auto';
  // Sucrose peut renvoyer les booléens ou les nombres sous forme de texte ("False", "19") :
  // sans conversion, "False" serait lu comme vrai et forcerait par exemple le mode test
  else if (BOOL_PROPS.includes(name)) v = (typeof v === 'string') ? v.trim().toLowerCase() === 'true' : !!v;
  else if (name !== 'city') v = Number(v);
  window.wallpaperPropertyListener.applyUserProperties({ [name]: { value: v } });
};

window.addEventListener('resize', resize);
resize();
refreshWeather().then(() => {                          // ?weather=rain : applique l'état sans transition (tests)
  if (new URLSearchParams(location.search).has('weather')) Object.assign(wth, wthT);
});
requestAnimationFrame(frame);

})();
</script>
